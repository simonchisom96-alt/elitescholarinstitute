<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06152c">
<title>ESI Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--b:#0b4ea2;--b2:#1684e8;--n:#06152c;--n2:#0a2142;--g:#f6c800;--t:#eef5ff;--m:#91a9ca;--l:#244a79;--c:#0a1d38;--ok:#20d889;--bad:#ff6574}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--n);color:var(--t);font-family:Poppins,Arial,sans-serif;user-select:none}input,textarea{user-select:text}button{font:inherit;border:0;color:inherit;cursor:pointer}body{background:radial-gradient(circle at 80% 0,#1684e830,transparent 35%),linear-gradient(145deg,#06132a,#0a2040 55%,#07162d)}
.app{width:min(720px,100%);margin:auto;min-height:100vh;padding:20px 14px 30px}.top{display:flex;align-items:center;gap:10px;padding:4px 0 18px}.logo{width:40px;height:40px;border:2px solid var(--g);border-radius:11px;object-fit:cover;background:#fff}.brand{flex:1;min-width:0}.brand b{display:block;color:var(--g);font-size:11px}.brand span{display:block;color:var(--m);font-size:7px}.card{background:#081a33ed;border:1px solid #ffffff16;border-radius:20px;padding:18px;box-shadow:0 14px 40px #0004}.cover{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center}.cover h1{font-size:28px;line-height:1.15;margin:0 0 9px}.cover p{color:var(--m);font-size:10px;line-height:1.7;margin:0 0 20px}.btn{width:100%;padding:13px;border-radius:12px;font-size:10px;font-weight:800;background:linear-gradient(135deg,var(--b2),var(--b))}.btn.gold{background:linear-gradient(135deg,#ffd84d,var(--g));color:#172200}.muted{color:var(--m);font-size:8px}.progress{height:6px;background:#10294d;border-radius:99px;overflow:hidden;margin:4px 0 18px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--b2),var(--g));width:0}.qmeta{display:flex;justify-content:space-between;color:var(--m);font-size:8px;margin-bottom:10px}.question{font-size:18px;line-height:1.4;font-weight:800;margin:0 0 16px}.options{display:grid;gap:8px}.opt{width:100%;text-align:left;padding:13px;border:1px solid var(--l);background:#0b2342;border-radius:12px;font-size:10px}.opt.selected{border-color:var(--g);background:#f6c80016}.opt.correct{border-color:var(--ok)}.opt.wrong{border-color:var(--bad)}.nav{display:flex;gap:8px;margin-top:16px}.nav .btn{flex:1}.nav .secondary{background:#10294d;border:1px solid var(--l)}.result{text-align:center;padding:24px 12px}.score{font-size:48px;font-weight:900;color:var(--g);line-height:1}.result h2{font-size:20px;margin:12px 0 5px}.result p{color:var(--m);font-size:9px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.stat{background:#09203c;border:1px solid #21466f;border-radius:12px;padding:11px}.stat b{display:block;color:var(--g);font-size:17px}.stat span{color:var(--m);font-size:7px}.error{text-align:center;padding:60px 20px}.error h2{font-size:18px;margin:0 0 8px}.error p{color:var(--m);font-size:9px;line-height:1.6}.hidden{display:none!important}@media(min-width:650px){.app{padding-top:35px}.cover{min-height:700px}.card{padding:24px}}
</style>
</head>
<body><main class="app" id="app"></main>
<script>
(()=>{'use strict';
const key='esi.quiz2.share.v22';const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=()=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}};
const slug=()=>{try{const p=new URLSearchParams(location.search);return p.get('quiz')||p.get('q')||''}catch{return''}};
const quiz=()=>read().find(x=>x.slug===slug()&&x.status==='published');
let q=null,answers=[],index=0,started=false,done=false;
function header(){return '<div class="top"><img class="logo" src="logo.jpg" onerror="this.style.display=\'none\'"><div class="brand"><b>ELITE SCHOLAR INSTITUTE</b><span>QUIZ</span></div></div>'}
function normalize(x){return{x:titleText(x),description:String(x.description||''),questions:Array.isArray(x.questions)?x.questions:[]}}
function titleText(x){return String(x.title||'Quiz')}
function start(){started=true;renderQuestion()}
function render(){if(!q){app.innerHTML=header()+'<section class="card error"><h2>Quiz unavailable</h2><p>This quiz is not available here.</p></section>';return}app.innerHTML=header()+'<section class="card cover"><div class="muted">ELITE SCHOLAR INSTITUTE</div><h1>'+esc(q.title)+'</h1><p>'+esc(q.description||'Complete the quiz and submit when you are done.')+'</p><button class="btn gold" id="start">Start</button></section>';document.getElementById('start').onclick=start}
function renderQuestion(){if(index>=q.questions.length){finish();return}const x=q.questions[index]||{};const opts=Array.isArray(x.options)?x.options:[];const val=answers[index];app.innerHTML=header()+'<section class="card"><div class="qmeta"><span>'+ (index+1)+' / '+q.questions.length+'</span><span>'+esc(String(x.type||'Question'))+'</span></div><div class="progress"><i style="width:'+(((index+1)/q.questions.length)*100)+'%"></i></div><h1 class="question">'+esc(x.text||x.question||'Question')+'</h1><div class="options">'+(opts.length?opts.map((o,i)=>'<button class="opt '+(val===i?'selected':'')+'" data-i="'+i+'">'+esc(typeof o==='object'?(o.text||o.label||''):o)+'</button>').join(''):'<input id="answer" style="width:100%;padding:13px;border-radius:12px;border:1px solid var(--l);background:#0b2342;color:#fff" value="'+esc(val||'')+'" placeholder="Your answer">')+'</div><div class="nav"><button class="btn secondary" id="back" '+(index?'':'disabled')+'>Back</button><button class="btn" id="next">'+(index===q.questions.length-1?'Submit':'Next')+'</button></div></section>';
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{answers[index]=Number(b.dataset.i);renderQuestion()});const input=document.getElementById('answer');if(input)input.oninput=()=>answers[index]=input.value;document.getElementById('back').onclick=()=>{if(index){index--;renderQuestion()}};document.getElementById('next').onclick=()=>{if(index<q.questions.length-1){index++;renderQuestion()}else finish()}}
function finish(){done=true;let score=0;answers.forEach((a,i)=>{const x=q.questions[i]||{};const c=x.correct; if(typeof c==='number'&&a===c)score++;if(Array.isArray(c)&&Array.isArray(a)&&JSON.stringify(c)===JSON.stringify(a))score++});const total=q.questions.length;app.innerHTML=header()+'<section class="card result"><div class="score">'+score+'/'+total+'</div><h2>Submitted</h2><p>Your response has been recorded on this device.</p><div class="summary"><div class="stat"><b>'+total+'</b><span>Questions</span></div><div class="stat"><b>'+ (total?Math.round(score/total*100):0)+'%</b><span>Score</span></div></div><button class="btn gold" id="again">Try again</button></section>';document.getElementById('again').onclick=()=>{answers=[];index=0;done=false;started=false;render()}}
q=quiz();if(q)q=normalize(q);render();
})();
</script></body></html>
