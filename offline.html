<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04142f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Elite Scholar">
<meta name="color-scheme" content="dark">

<link rel="manifest" href="/manifest.json">

<title>Offline • Elite Scholar Institute</title>

<style>

:root{
--primary:#00ff88;
--primary2:#00c853;
--blue:#3b82f6;
--bg:#04142f;
--glass:rgba(255,255,255,.07);
--border:rgba(255,255,255,.10);
--text:#ffffff;
--sub:#c8d5f5;
--danger:#ff5252;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html{
height:100%;
scroll-behavior:smooth;
}

body{

min-height:100vh;
overflow:hidden;

display:flex;
align-items:center;
justify-content:center;

padding:
max(20px,env(safe-area-inset-top))
20px
max(20px,env(safe-area-inset-bottom));

font-family:
system-ui,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Roboto,
sans-serif;

background:
linear-gradient(rgba(2,8,28,.95),rgba(3,10,35,.96)),
url("/advert.png");

background-size:cover;
background-position:center;
background-attachment:fixed;
background-color:var(--bg);

color:var(--text);

position:relative;

}

/* animated background */

.bg{
position:fixed;
inset:0;
overflow:hidden;
z-index:-3;
}

.blob{

position:absolute;
border-radius:50%;
filter:blur(90px);
opacity:.18;

animation:
float 16s ease-in-out infinite;

}

.blob:nth-child(1){

width:320px;
height:320px;

left:-100px;
top:-90px;

background:#0066ff;

}

.blob:nth-child(2){

width:360px;
height:360px;

right:-120px;
bottom:-120px;

background:#00ff88;

animation-delay:3s;

}

.blob:nth-child(3){

width:220px;
height:220px;

left:45%;
top:15%;

background:#8b5cf6;

animation-delay:7s;

opacity:.12;

}

@keyframes float{

0%,100%{

transform:
translateY(0)
translateX(0)
scale(1);

}

50%{

transform:
translateY(-40px)
translateX(20px)
scale(1.08);

}

}

/* card */

.offline-box{

width:100%;
max-width:430px;

background:var(--glass);

border:1px solid var(--border);

backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);

border-radius:34px;

padding:38px 28px;

box-shadow:

0 18px 50px rgba(0,0,0,.35),

0 0 60px rgba(0,255,136,.05);

text-align:center;

position:relative;

overflow:hidden;

}

/* glowing border */

.offline-box::before{

content:"";

position:absolute;

inset:-2px;

border-radius:inherit;

padding:1px;

background:
linear-gradient(
135deg,
rgba(0,255,136,.45),
rgba(59,130,246,.30),
transparent);

-webkit-mask:
linear-gradient(#000 0 0) content-box,
linear-gradient(#000 0 0);

-webkit-mask-composite:xor;

mask-composite:exclude;

pointer-events:none;

}

/* icon */

.icon-wrap{

width:100px;
height:100px;

margin:auto;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

background:
radial-gradient(circle,
rgba(0,255,136,.25),
rgba(255,255,255,.04));

box-shadow:

0 0 0 8px rgba(0,255,136,.04),
0 0 40px rgba(0,255,136,.20);

animation:
pulse 2s infinite;

}

.offline-icon{

font-size:58px;

animation:
bounce 3s infinite;

}

@keyframes pulse{

0%{
box-shadow:
0 0 0 0 rgba(0,255,136,.30);
}

70%{
box-shadow:
0 0 0 20px rgba(0,255,136,0);
}

100%{
box-shadow:
0 0 0 0 rgba(0,255,136,0);
}

}

@keyframes bounce{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-8px);
}

}

/* title */

h2{

margin-top:22px;

font-size:30px;

font-weight:900;

letter-spacing:.5px;

color:var(--primary);

text-shadow:
0 0 25px rgba(0,255,136,.35);

}

.desc{

margin-top:14px;

color:var(--sub);

line-height:1.8;

font-size:16px;

}

/* status */

.status{

margin-top:22px;

display:inline-flex;

align-items:center;

gap:10px;

padding:10px 18px;

border-radius:999px;

background:rgba(255,255,255,.05);

font-size:14px;

font-weight:700;

color:#ffd166;

}

.status-dot{

width:10px;
height:10px;

border-radius:50%;

background:#ff5252;

box-shadow:
0 0 12px #ff5252;

animation:
blink 1.3s infinite;

}

@keyframes blink{

50%{

opacity:.25;

}

}

/* buttons */

.btn-group{

display:flex;

gap:14px;

margin-top:28px;

flex-wrap:wrap;

}

button{

flex:1;

min-width:140px;

padding:16px;

border:none;

border-radius:18px;

font-size:15px;

font-weight:800;

cursor:pointer;

transition:
transform .18s,
box-shadow .25s;

}

button:active{

transform:scale(.96);

}

.retry-btn{

background:
linear-gradient(135deg,
var(--primary2),
var(--primary));

color:#001d11;

box-shadow:
0 10px 25px rgba(0,255,136,.30);

}

.back-btn{

background:
rgba(255,255,255,.06);

color:var(--primary);

border:1px solid rgba(0,255,136,.25);

}

/* toast */

.esi-toast{

animation:
toastIn .25s ease;

}

@keyframes toastIn{

from{

opacity:0;

transform:
translate(-50%,20px);

}

to{

opacity:1;

transform:
translate(-50%,0);

}

}

/* reduce motion */

@media(prefers-reduced-motion:reduce){

*{

animation:none!important;

transition:none!important;

scroll-behavior:auto;

}

}

</style>

</head>
<body>

<!-- Animated Background -->
<div class="bg" aria-hidden="true">
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
</div>

<!-- Offline Card -->
<main class="offline-box">

    <div class="icon-wrap">
        <div class="offline-icon" id="offlineIcon">📡</div>
    </div>

    <h2 id="statusTitle">You're Offline</h2>

    <p class="desc">
        Searching for Internet connection...
        <br><br>
        Pages you've already visited are still available.
        Connect to the internet to access everything again.
    </p>

    <!-- Live Network Status -->
    <div class="status" id="networkStatus">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">No Internet Connection</span>
    </div>

    <!-- Auto reconnect message -->
    <p
        id="connectionMessage"
        style="
        margin-top:18px;
        color:#9ec5ff;
        font-size:14px;
        line-height:1.7;
        ">
        Waiting for your internet connection...
    </p>

    <!-- Buttons -->
    <div class="btn-group">

        <button
            class="back-btn"
            id="backBtn"
            aria-label="Go Back">
            ← Back
        </button>

        <button
            class="retry-btn"
            id="retryBtn"
            aria-label="Try Again">
            ↻ Try Again
        </button>

    </div>

</main>

<style>
  
    
    
@keyframes blueGlow {
 0%, 100% { box-shadow:0 0 15px rgba(59,130,246,0.4); }
 50% { box-shadow:0 0 30px rgba(59,130,246,0.7); }
}
</style>




<style>
/* ===== GLOBAL SMOOTH PAGE SCROLL CONFIGURATION ===== */
html {
  height: 100%;
  overflow-y: scroll; /* Forces a dedicated root scroll track so it slides freely */
}

body {
  min-height: 100%; 
  width: 100%; 
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch; /* Ensures snappy, native iOS inertia physics */
  overscroll-behavior-y: auto; /* Restores free boundary bounce at both ends */
}

/* Base box modeling for child elements */
body * {
  box-sizing: border-box;
}

/* Prevent text selection across the entire website */
body {
  -webkit-user-select: none; /* Safari */
  -ms-user-select: none;     /* IE 10 and Consumer Edge */
  user-select: none;         /* Standard syntax for Chrome, Firefox, and Opera */
}


// Disable right-click context menu
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
});

// Disable copy keyboard shortcuts (Ctrl+C, Ctrl+X, Ctrl+U)
document.addEventListener('keydown', function(e) {
  // Disable Ctrl+C or Cmd+C (Copy)
  if ((e.ctrlKey || e.metaKey) && e.key === 'c') {
    e.preventDefault();
  }
  
  // Disable Ctrl+X or Cmd+X (Cut)
  if ((e.ctrlKey || e.metaKey) && e.key === 'x') {
    e.preventDefault();
  }

  // Disable Ctrl+U or Cmd+U (View Source)
  if ((e.ctrlKey || e.metaKey) && e.key === 'u') {
    e.preventDefault();
  }
});





</style>


<script>
/**
 * REUSABLE SCROLL CONTROLLER FUNCTIONS
 * Use these anywhere you need to manage background scroll locking 
 * when custom popups, menus, or lightboxes trigger.
 */

function lockBackgroundScroll() {
  document.body.style.overflow = 'hidden';
}

// Call this when your modal/lightbox CLOSES
function unlockBackgroundScroll() {
  document.body.style.overflow = '';
}


/* ==========================================================================
   EXAMPLE IMPLEMENTATION FOR YOUR MODAL / LIGHTBOX SCRIPTS:

function openYourCustomModal() {
  // 1. Lock the page background from dragging
  lockBackgroundScroll();

  // myModalElement.classList.add('active');
}

function closeYourCustomModal() {

  unlockBackgroundScroll();
  
  // 2. Your actual hiding logic (e.g., removing an active class)
  // myModalElement.classList.remove('active');

<script>
(() => {

let reconnectTimer = null;
let retryLock = false;

const retryBtn = document.getElementById("retryBtn");
const backBtn = document.getElementById("backBtn");

const statusText = document.getElementById("statusText");
const statusTitle = document.getElementById("statusTitle");
const statusDot = document.getElementById("statusDot");
const connectionMessage = document.getElementById("connectionMessage");
const offlineIcon = document.getElementById("offlineIcon");

/* ---------- Toast ---------- */

function showToast(message,color="#00ff88"){

    document.querySelector(".esi-toast")?.remove();

    const toast=document.createElement("div");

    toast.className="esi-toast";

    toast.textContent=message;

    toast.style.cssText=`
position:fixed;
left:50%;
bottom:30px;
transform:translateX(-50%);
background:${color};
color:#000;
padding:14px 22px;
border-radius:14px;
font-weight:800;
z-index:999999;
box-shadow:0 10px 25px rgba(0,0,0,.35);
`;

    document.body.appendChild(toast);

    setTimeout(()=>{
        toast.remove();
    },2600);

}

/* ---------- Update Status ---------- */

function updateStatus(){

    if(navigator.onLine){

        statusTitle.textContent="Connection Restored";

        statusText.textContent="Internet Available";

        connectionMessage.textContent="Reconnecting...";

        offlineIcon.textContent="🔗";

        statusDot.style.background="#00ff88";
        statusDot.style.boxShadow="0 0 15px #00ff88";

    }else{

        statusTitle.textContent="You're Offline";

        statusText.textContent="No Internet Connection";

        connectionMessage.textContent="Waiting for your internet connection...";

        offlineIcon.textContent="📡";

        statusDot.style.background="#ff4b4b";
        statusDot.style.boxShadow="0 0 15px #ff4b4b";

    }

}

/* ---------- Retry ---------- */

retryBtn.addEventListener("click",()=>{

    if(retryLock) return;

    retryLock=true;

    setTimeout(()=>retryLock=false,1000);

    if(!navigator.onLine){

        showToast("No internet connection","#ffcc00");

        return;

    }

    showToast("Reconnecting...");

    location.reload();

});

/* ---------- Back ---------- */

backBtn.addEventListener("click",()=>{

    if(history.length>1){

        history.back();

    }else{

        location.replace("/");

    }

});

/* ---------- Connection Restored ---------- */

window.addEventListener("online",()=>{

    updateStatus();

    showToast("Back Online");

    clearTimeout(reconnectTimer);

    reconnectTimer=setTimeout(()=>{

        const pending=sessionStorage.getItem("esiPendingExternalLink");

        if(pending){

            sessionStorage.removeItem("esiPendingExternalLink");

            window.open(pending,"_self");

            return;

        }

        location.reload();

    },900);

});

/* ---------- Connection Lost ---------- */

window.addEventListener("offline",()=>{

    updateStatus();

    showToast("Connection Lost","#ff5252");

});

/* ---------- Initial ---------- */

updateStatus();

/* ---------- Auto Retry ---------- */

setInterval(()=>{

    if(navigator.onLine){

        updateStatus();

    }

},4000);

/* ---------- Prevent accidental zoom ---------- */

document.addEventListener("gesturestart",e=>e.preventDefault());

})();
</script>
</body>
</html>
