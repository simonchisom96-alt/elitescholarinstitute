services:
  - type: web
    name: esi-fcm
    runtime: node
    plan: free
    rootDir: render-fcm
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://elitescholarinstitute.onrender.com
