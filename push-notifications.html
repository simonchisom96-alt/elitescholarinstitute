<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#04142f">
  <title>ESI Notifications</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#04142f;color:#fff;font-family:Poppins,system-ui,sans-serif;display:grid;place-items:center;padding:24px}
    .card{width:min(100%,430px);background:#0b2148;border:1px solid rgba(255,215,0,.35);border-radius:22px;padding:26px;box-shadow:0 18px 50px rgba(0,0,0,.35);text-align:center}
    img{width:72px;height:72px;border-radius:50%;object-fit:cover;margin-bottom:12px}
    h1{font-size:22px;margin:4px 0 8px}
    p{color:#cbd5e1;font-size:14px;line-height:1.6;margin:0 0 20px}
    button{width:100%;border:0;border-radius:13px;padding:14px;background:#ffd700;color:#04142f;font-weight:800;font-size:14px;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    #status{margin-top:16px;font-size:13px;line-height:1.5;color:#93c5fd;min-height:20px}
    .back{display:inline-block;margin-top:16px;color:#cbd5e1;text-decoration:none;font-size:13px}
  </style>
  <script src="https://js.pusher.com/beams/1.0/push-notifications-cdn.js"></script>
</head>
<body>
  <main class="card">
    <img src="/logo.jpg" alt="Elite Scholar Institute">
    <h1>ESI Push Notifications</h1>
    <p>Enable notifications to receive important Elite Scholar Institute announcements even when the website is not open.</p>
    <button id="enable">ENABLE ESI NOTIFICATIONS</button>
    <div id="status" role="status"></div>
    <a class="back" href="/">← Back to ESI</a>
  </main>
  <script>
    const INSTANCE_ID = '194482e6-d06b-4102-bd18-c8c32ca77565';
    const INTEREST = 'esi-announcements';
    const SW_URL = '/sw.js?v=36.2404';
    const button = document.getElementById('enable');
    const status = document.getElementById('status');
    const setStatus = text => status.textContent = text;

    async function enableNotifications(){
      button.disabled = true;
      try {
        if (!('Notification' in window) || !('serviceWorker' in navigator)) {
          throw new Error('This browser does not support web push notifications.');
        }

        // Ask while the user gesture is still active. This makes the browser permission step explicit.
        if (Notification.permission === 'default') {
          setStatus('Requesting notification permission…');
          const permission = await Notification.requestPermission();
          if (permission !== 'granted') {
            setStatus(permission === 'denied'
              ? 'Notifications are blocked for this site. Allow them in browser/site settings, then try again.'
              : 'Notification permission was not granted. Tap the button to try again.');
            return;
          }
        }
        if (Notification.permission !== 'granted') {
          setStatus('Notifications are blocked for this site. Allow them in browser/site settings, then try again.');
          return;
        }

        setStatus('Connecting ESI notifications…');
        const registration = await navigator.serviceWorker.register(SW_URL, {
          scope: '/',
          updateViaCache: 'none'
        });
        await registration.update().catch(() => {});
        const readyRegistration = registration.active
          ? registration
          : await Promise.race([
              navigator.serviceWorker.ready,
              new Promise((_, reject) => setTimeout(() => reject(new Error('Service worker activation timed out.')), 20000))
            ]);

        setStatus('Registering this browser with ESI…');
        const beamsClient = new PusherPushNotifications.Client({
          instanceId: INSTANCE_ID,
          serviceWorkerRegistration: readyRegistration
        });

        const state = await Promise.race([
          beamsClient.getRegistrationState(),
          new Promise((_, reject) => setTimeout(() => reject(new Error('Beams registration check timed out.')), 20000))
        ]);
        const states = PusherPushNotifications.RegistrationState;

        if (state === states.PERMISSION_DENIED) {
          setStatus('Notifications are blocked for this site. Allow notifications in your browser/site settings, then try again.');
          return;
        }

        if (state !== states.PERMISSION_GRANTED_REGISTERED_WITH_BEAMS) {
          setStatus('Finishing ESI notification registration…');
          await Promise.race([
            beamsClient.start(),
            new Promise((_, reject) => setTimeout(() => reject(new Error('Beams start timed out.')), 20000))
          ]);
        }

        await Promise.race([
          beamsClient.addDeviceInterest(INTEREST),
          new Promise((_, reject) => setTimeout(() => reject(new Error('Interest subscription timed out.')), 20000))
        ]);

        setStatus('✓ ESI notifications are enabled on this browser.');
        button.textContent = 'NOTIFICATIONS ENABLED';
      } catch (error) {
        console.error('ESI Beams setup failed:', error);
        setStatus('Could not enable notifications: ' + (error && error.message ? error.message : 'setup failed') + ' Try again.');
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener('click', enableNotifications);
  </script>
</body>
</html>
