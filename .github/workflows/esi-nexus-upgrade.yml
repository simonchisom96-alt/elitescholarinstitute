name: ESI Nexus upgrade
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[nexus-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Nexus analytics
        shell: python
        run: |
          from pathlib import Path
          p=Path('quiz2.html')
          s=p.read_text(encoding='utf-8')
          if 'id="esiNexusPanel"' in s:
              raise SystemExit(0)
          block='''
<section class="panel" id="esiNexusPanel">
<style>
.nexus-wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(250px,.65fr);gap:12px}.nexus-card{background:linear-gradient(145deg,#07182f,#0a2448);border:1px solid #28598f;border-radius:20px;padding:14px;overflow:hidden;box-shadow:0 18px 50px #0006}.nexus-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.nexus-head h2{margin:0;color:var(--gold);font-size:15px}.nexus-head p{margin:3px 0 0;color:var(--muted);font-size:8px}.nexus-stage{position:relative;min-height:410px;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,#1684e81b,transparent 58%),#06152c;border:1px solid #21466f;border-radius:16px}.nexus-svg{width:min(100%,560px);height:auto;overflow:visible}.nexus-grid{fill:none;stroke:#23466f;stroke-width:1}.nexus-axis{stroke:#315a88;stroke-width:1.1}.nexus-fill{fill:#1684e82b;stroke:#45b6ff;stroke-width:2.5;filter:drop-shadow(0 0 8px #1684e844)}.nexus-handle{fill:var(--gold);stroke:#fff;stroke-width:2.5;cursor:grab;filter:drop-shadow(0 2px 7px #0008)}.nexus-handle:active{cursor:grabbing}.nexus-label{font-size:11px;fill:#e8f2ff;font-weight:800}.nexus-value{font-size:10px;fill:var(--gold);font-weight:900}.nexus-center{fill:#07152b;stroke:var(--gold);stroke-width:2}.nexus-side{display:grid;gap:8px}.nexus-score{padding:15px;border-radius:17px;background:#081a33;border:1px solid #ffffff15;text-align:center}.score-ring2{--score:0;width:132px;height:132px;margin:0 auto 10px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--score)*1%),#17345b 0);display:grid;place-items:center;position:relative}.score-ring2:after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;background:#081a33}.score-ring2 strong,.score-ring2 small{position:absolute;z-index:2}.score-ring2 strong{font-size:26px;color:var(--gold)}.score-ring2 small{margin-top:45px;color:var(--muted);font-size:7px}.nexus-metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px}.nxm{padding:9px;background:#09203c;border:1px solid #21466f;border-radius:10px;text-align:left}.nxm b{display:block;color:var(--gold);font-size:14px}.nxm span{color:var(--muted);font-size:7px}.nexus-factors{display:grid;gap:6px}.nxrow{display:grid;grid-template-columns:76px 1fr 34px;align-items:center;gap:7px;font-size:7px;color:var(--muted)}.nxbar{height:7px;border-radius:99px;background:#10294d;overflow:hidden}.nxbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue2),var(--gold));border-radius:99px}.nexus-note{font-size:7px;color:var(--muted);line-height:1.55;margin-top:9px}@media(max-width:720px){.nexus-wrap{grid-template-columns:1fr}.nexus-stage{min-height:330px}.nexus-label{font-size:9px}.nexus-value{font-size:8px}}
</style>
<div class="nexus-head"><div><h2>ESI NEXUS // Performance Matrix</h2><p>Five coupled dimensions. Drag a vertex and watch the learning profile rebalance.</p></div><span class="pill good">LIVE MODEL</span></div>
<div class="nexus-wrap"><div class="nexus-card"><div class="nexus-stage"><svg id="esiNexusSvg" class="nexus-svg" viewBox="0 0 600 480" aria-label="Interactive five-factor Nexus pentagon"><g id="nxGrid"></g><g id="nxAxes"></g><polygon id="nxPoly" class="nexus-fill"></polygon><circle class="nexus-center" cx="300" cy="240" r="35"></circle><text x="300" y="237" text-anchor="middle" class="nexus-label">ESI</text><text x="300" y="251" text-anchor="middle" class="nexus-value">NEXUS</text><g id="nxHandles"></g><g id="nxLabels"></g></svg></div></div><div class="nexus-side"><div class="nexus-score"><div id="nxRing" class="score-ring2"><strong id="nxScore">0</strong><small>INDEX / 100</small></div><b id="nxProfile" style="font-size:10px">Calibrating</b><p id="nxProfileText" class="nexus-note"></p></div><div class="nexus-metrics"><div class="nxm"><b id="nxSpeed">0</b><span>Speed</span></div><div class="nxm"><b id="nxAccuracy">0</b><span>Accuracy</span></div><div class="nxm"><b id="nxEngage">0</b><span>Engagement</span></div><div class="nxm"><b id="nxDifficulty">0</b><span>Difficulty</span></div><div class="nxm"><b id="nxClarity">0</b><span>Clarity</span></div><div class="nxm"><b id="nxSynergy">0</b><span>Synergy</span></div></div><div class="nexus-card"><div class="title"><div><h2 style="font-size:11px">Five-factor balance</h2><p>Real-time vector values</p></div></div><div class="nexus-factors" id="nxFactors"></div></div></div></div>
<script>
(()=>{const svg=document.getElementById('esiNexusSvg');if(!svg)return;const ns='http://www.w3.org/2000/svg',names=['Speed','Accuracy','Engagement','Difficulty','Clarity'],base=[82,91,76,68,87],cx=300,cy=240,R=175;let values=base.slice(),active=-1,drag=false;const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/5,r=R*v/100;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]},mk=(t,a)=>{const e=document.createElementNS(ns,t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e};function render(){const g=document.getElementById('nxGrid'),a=document.getElementById('nxAxes'),h=document.getElementById('nxHandles'),l=document.getElementById('nxLabels');g.innerHTML=a.innerHTML=h.innerHTML=l.innerHTML='';for(let z=20;z<=100;z+=20)g.appendChild(mk('polygon',{points:names.map((_,i)=>pt(i,z).join(',')).join(' '),class:'nexus-grid'}));names.forEach((n,i)=>{const p=pt(i,100),lp=pt(i,116);a.appendChild(mk('line',{x1:cx,y1:cy,x2:p[0],y2:p[1],class:'nexus-axis'}));const t=mk('text',{x:lp[0],y:lp[1],class:'nexus-label','text-anchor':'middle'});t.textContent=n;l.appendChild(t);const q=pt(i,values[i]),c=mk('circle',{cx:q[0],cy:q[1],r:10,class:'nexus-handle',tabindex:'0',role:'slider','aria-valuemin':'0','aria-valuemax':'100','aria-valuenow':values[i],'aria-label':n+' '+values[i]});c.addEventListener('pointerdown',e=>{active=i;drag=true;c.setPointerCapture?.(e.pointerId);e.preventDefault()});c.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowRight'){values[i]=Math.min(100,values[i]+2);render()}if(e.key==='ArrowDown'||e.key==='ArrowLeft'){values[i]=Math.max(0,values[i]-2);render()}});h.appendChild(c);const vt=mk('text',{x:q[0],y:q[1]-15,class:'nexus-value','text-anchor':'middle'});vt.textContent=values[i];l.appendChild(vt)});document.getElementById('nxPoly').setAttribute('points',values.map((v,i)=>pt(i,v).join(',')).join(' '));const avg=values.reduce((x,y)=>x+y,0)/5,spread=Math.max(...values)-Math.min(...values),sy=Math.max(0,Math.round(100-spread*.45)),score=Math.round(avg*.72+sy*.28);document.getElementById('nxRing').style.setProperty('--score',score);document.getElementById('nxScore').textContent=score;document.getElementById('nxSynergy').textContent=sy;['Speed','Accuracy','Engage','Difficulty','Clarity'].forEach((x,i)=>document.getElementById('nx'+x).textContent=values[i]);const p=score>=88?'Legendary':score>=78?'Balanced Elite':score>=66?'High Potential':'Recalibrate';document.getElementById('nxProfile').textContent=p;document.getElementById('nxProfileText').textContent=p==='Legendary'?'Exceptional balance across pace, correctness, engagement, cognitive stretch and clarity.':p==='Balanced Elite'?'A strong all-round configuration.':'One or more dimensions are pulling the matrix off-centre.';document.getElementById('nxFactors').innerHTML=names.map((n,i)=>'<div class="nxrow"><span>'+n+'</span><div class="nxbar"><i style="width:'+values[i]+'%"></i></div><b style="color:var(--gold)">'+values[i]+'</b></div>').join('')}function move(e){if(!drag||active<0)return;const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*480/r.height,a=-Math.PI/2+active*2*Math.PI/5,proj=(x-cx)*Math.cos(a)+(y-cy)*Math.sin(a);values[active]=Math.max(0,Math.min(100,Math.round(proj/R*100)));render()}svg.addEventListener('pointermove',move);svg.addEventListener('pointerup',()=>{drag=false;active=-1});svg.addEventListener('pointercancel',()=>{drag=false;active=-1});render()})();
</script></section>
'''
          marker='<div class="grid4">'
          if marker not in s: raise SystemExit('home marker missing')
          s=s.replace(marker,block+marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit upgrade
        run: |
          git config user.name "esi-upgrade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add quiz2.html
          git diff --cached --quiet && exit 0
          git commit -m "Add interactive ESI Nexus performance matrix [nexus-bot]"
          git push
