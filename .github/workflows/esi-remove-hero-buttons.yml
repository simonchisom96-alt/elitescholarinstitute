name: ESI Complete Requested Edits

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested edits and exact release bump
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Work from the actual current files and make only the requested changes.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the HERO CTA container including its nested btn-row.
          # The previous workflow used a non-nested regex and stopped at the first inner </div>.
          hero_buttons = re.compile(r'\n<div class="hero-buttons">\s*.*?<div class="btn-row">.*?</div>\s*</div>', re.I | re.S)
          s, n = hero_buttons.subn('', s, count=1)
          if n != 1:
              raise SystemExit('ERROR: expected exactly one complete hero-buttons block')

          # Keep PROCEED TO OUR MENU as plain text outside the removed CTA buttons.
          if 'PROCEED TO OUR MENU' not in s:
              marker = '<div class="loader-sub">\nA smart academic platform helping students excel in JAMB, WAEC, NECO and Post-UTME.</div>'
              if marker not in s:
                  raise SystemExit('ERROR: current hero description marker not found')
              s = s.replace(marker, marker + '\n\n<div style="margin-top:18px;text-align:center;font-weight:800;color:#ffd700;font-size:13px;">PROCEED TO OUR MENU</div>', 1)

          # Keep the Welcome description concise if the current longer version is present.
          old_hero = 'Elite Scholar Institute is an online academic platform helping students dominate JAMB, WAEC, NECO and Post-UTME through smart tutoring, CBT drilling, mentorship, revision systems and examination strategies.'
          new_hero = 'A smart academic platform for JAMB, WAEC, NECO and Post-UTME success.'
          if old_hero in s:
              s = s.replace(old_hero, new_hero, 1)

          # Remove the entire WHY STUDENTS CHOOSE section if present; otherwise leave it alone.
          why = re.compile(r'\s*<section\s+class="section"[^>]*>\s*<div\s+class="title"[^>]*>\s*WHY STUDENTS CHOOSE ELITE SCHOLAR INSTITUTE\s*</div>.*?</section>', re.I | re.S)
          s, nwhy = why.subn('', s, count=1)

          # Results section: keep only the requested heading before the existing result pictures/cards.
          results = re.compile(r'(<section\s+class="section"\s+id="breakdown">)(.*?)(</section>)', re.I | re.S)
          m = results.search(s)
          if not m:
              raise SystemExit('ERROR: results section not found')
          body = m.group(2)

          # Replace the existing heading text, regardless of its current capitalization.
          body, nh = re.subn(r'(<div\s+class="title"[^>]*>\s*)Top Results Of Previous Elites(\s*</div>)', r'\1TOP RESULTS OF PREVIOUS ELITES\2', body, count=1, flags=re.I | re.S)
          if nh != 1:
              raise SystemExit('ERROR: results heading not found')

          # Remove the explanatory subtitle only; preserve the result-card pictures and their data.
          body, ns = re.subn(r'\s*<p\s+class="subtitle"[^>]*>.*?</p>\s*', '\n\n', body, count=1, flags=re.I | re.S)
          if ns != 1:
              raise SystemExit('ERROR: results explanatory description not found')

          s = s[:m.start()] + m.group(1) + body + m.group(3) + s[m.end():]
          p.write_text(s, encoding='utf-8')

          # app.js: uppercase the install-popup statement only.
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          if 'Install the Elite Scholar App' in s:
              s = s.replace('Install the Elite Scholar App', 'INSTALL THE ELITE SCHOLAR APP', 1)
          elif 'INSTALL THE ELITE SCHOLAR APP' not in s:
              raise SystemExit('ERROR: install popup statement not found')

          # Exact web build bump 36.2348 -> 36.2349.
          if "const BUILD = '36.2348';" not in s:
              raise SystemExit('ERROR: app.js BUILD was not exactly 36.2348 before bump')
          s = s.replace('application controller 36.2348', 'application controller 36.2349', 1)
          s = s.replace("const BUILD = '36.2348';", "const BUILD = '36.2349';", 1)
          p.write_text(s, encoding='utf-8')

          # Exact Android bump 4.8 / 362408 -> 4.9 / 362409.
          p = Path('android/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          if 'versionCode = 362408' not in s or 'versionName = "4.8"' not in s:
              raise SystemExit('ERROR: Android version was not exactly 4.8 / 362408 before bump')
          s = s.replace('versionCode = 362408', 'versionCode = 362409', 1)
          s = s.replace('versionName = "4.8"', 'versionName = "4.9"', 1)
          p.write_text(s, encoding='utf-8')

          # Hard verification before commit.
          final_index = Path('index.html').read_text(encoding='utf-8')
          if '<div class="hero-buttons">' in final_index or '<div class="btn-row">' in final_index:
              raise SystemExit('ERROR: hero CTA/button markup remains')
          if 'PROCEED TO OUR MENU' not in final_index:
              raise SystemExit('ERROR: menu prompt missing')
          if 'Join Free Class' in final_index and '🎓 JOIN FREE ONE-MONTH CLASS' not in final_index:
              raise SystemExit('ERROR: unexpected Join Free Class text remains without side-menu link')
          if 'WHY STUDENTS CHOOSE ELITE SCHOLAR INSTITUTE' in final_index:
              raise SystemExit('ERROR: WHY block remains')
          if 'HOW ELITE SCHOLAR INSTITUTE STUDENTS SCORE HIGH' in final_index.upper() or 'HOW ELITE STUDENTS SCORE HIGH' in final_index.upper():
              raise SystemExit('ERROR: old results explanatory heading remains')
          if 'TOP RESULTS OF PREVIOUS ELITES' not in final_index:
              raise SystemExit('ERROR: requested results heading missing')
          if '<p class="subtitle">' in final_index:
              raise SystemExit('ERROR: results explanatory subtitle remains')
          if '🎓 JOIN FREE ONE-MONTH CLASS' not in final_index:
              raise SystemExit('ERROR: side-menu Join Free Class link was unexpectedly removed')

          final_app = Path('app.js').read_text(encoding='utf-8')
          if 'INSTALL THE ELITE SCHOLAR APP' not in final_app:
              raise SystemExit('ERROR: uppercase install statement missing')
          if "const BUILD = '36.2349';" not in final_app:
              raise SystemExit('ERROR: app.js build bump missing')

          final_gradle = Path('android/app/build.gradle.kts').read_text(encoding='utf-8')
          if 'versionCode = 362409' not in final_gradle or 'versionName = "4.9"' not in final_gradle:
              raise SystemExit('ERROR: Android 4.9 bump missing')

          print('ALL REQUESTED EDITS VERIFIED')
          PY

      - name: Commit requested changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/esi-remove-hero-buttons.yml
          git add index.html app.js android/app/build.gradle.kts .github/workflows/esi-remove-hero-buttons.yml
          git diff --cached --check
          git diff --cached --name-only
          git commit -m 'feat: complete requested index edits and bump Android to v4.9'
          git push origin HEAD:main
