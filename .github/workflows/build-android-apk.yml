name: Elite Scholar Institute Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app.js'
      - 'sw.js'
      - 'downloader.js'
      - 'manifest.json'
      - 'quiz2.html'
      - 'quiz2-*.js'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-main
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Normalize Quiz Studio V5 source
        shell: bash
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('quiz2.html'); s=p.read_text(encoding='utf-8'); changed=False
          if 'ESI_QUIZ2_SOURCE_V5' not in s:
              s=s.replace('<div class="brand"><b>ELITE SCHOLAR INSTITUTE</b><span>QUIZ STUDIO • USER WORKSPACE</span></div>','<div class="brand" aria-label="ESI"></div>')
              s=re.sub(r'const novel=\[.*?\];','const novel=[];',s,count=1,flags=re.S)
              s=re.sub(r'<div class="stat"><b>\$\{novel.length\}</b><span>Innovation ideas</span></div>','',s,count=1)
              s=re.sub(r'<section class="panel"><div class="title"><div><h2>Novel feature registry — 140</h2>.*?</section>','',s,count=1,flags=re.S)
              s=s.replace('Explore the complete ESI ecosystem map. Every major family and all 140 novel concepts have a named place in the product architecture.','Explore the product architecture, validation systems and outcome-driven analytics.')
              s=s.replace('Drag five performance forces around a living pentagon and see the balance change.','See a living performance model computed from actual quiz outcomes.')
              s=s.replace('Five forces meet in one living model: Speed, Accuracy, Difficulty, Consistency and Mastery. Drag the points on the pentagon or use the precision sliders. The balance score changes immediately.','Five forces are computed from actual quiz outcomes: Speed, Accuracy, Difficulty, Consistency and Mastery. The model is read-only and updates when results change.')
              s=s.replace('Built to become response-driven when result data is connected.','Computed from the latest available quiz outcome; it updates automatically when result data changes.')
              s=s.replace('</body>','<script src="quiz2-intelligence-v5.js"></script>\n<!-- ESI_QUIZ2_SOURCE_V5 -->\n</body>',1); p.write_text(s,encoding='utf-8'); changed=True
          print('Quiz Studio V5 source normalization:', 'changed' if changed else 'already normalized')
          PY
          grep -q 'ESI_QUIZ2_SOURCE_V5' quiz2.html; grep -q 'quiz2-intelligence-v5.js' quiz2.html
          ! grep -q 'ELITE SCHOLAR INSTITUTE</b><span>QUIZ STUDIO' quiz2.html
          ! grep -q 'Novel feature registry — 140' quiz2.html
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- quiz2.html; then git add quiz2.html; git commit -m 'Apply Quiz Studio V5 source cleanup [skip ci]'; git push; fi
      - name: Verify engines and run engine self-tests
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/const BUILD = '[^']*'/const BUILD = '36.2405'/" app.js
          sed -i "s/esi-cache-[0-9.]*/esi-cache-36.2405/" sw.js
          sed -i "s/esi-pdf-cache-[0-9.]*/esi-pdf-cache-36.2405/" downloader.js
          grep -m1 "const BUILD" app.js; grep -m1 "CACHE_VERSION" sw.js; grep -m1 "CACHE_NAME" downloader.js
          grep -E "versionCode|versionName" android/app/build.gradle.kts
          for f in quiz2-intelligence-v5.js quiz2-chat.js quiz2-studio-v3.js quiz2-nexus-engine-v2.js quiz2-communication-hub.js quiz2-communication-v4.js quiz2-engines-v7.js quiz2-logic-v8.js; do test -f "$f"; node --check "$f"; done
      - name: Bundle defined ESI offline shell
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets; mkdir -p android/app/src/main/assets/site
          cat > /tmp/esi-shell.txt <<'EOF'
          index.html
          logo.jpg
          advert.png
          esi.jpg
          founder.jpg
          manifest.json
          offline.html
          app.js
          downloader.js
          Textbooks.html
          uniben.html
          crstextbook.html
          literaturetextbook.html
          postutme.html
          buk.html
          imsu.html
          oou.html
          eksu.html
          esut.html
          lautech.html
          aaua.html
          syllables.html
          Grace.jpg
          Chuka.jpg
          325.jpg
          339.jpg
          faloke.jpg
          emma.jpg
          uniport.html
          unijos.html
          unimed.html
          unical.html
          yabatech.html
          oauth.html
          luth.html
          delsu.html
          governmenttextbook.html
          Englishtextbook.html
          biologytextbook.html
          chemistrytextbook.html
          economicstextbook.html
          physicstextbook.html
          mathematicstextbook.html
          motivation.html
          chapter2.html
          chapter3.html
          chapter4.html
          chapter5.html
          chapter6.html
          chapter7.html
          chapter8.html
          chapter9.html
          chapter10.html
          furthermathstextbook.html
          accountingtextbook.html
          motivation2.html
          motivation3.html
          biop.html
          motivatio.html
          uip.html
          ulp.html
          picture.html
          motivation4.html
          unn.html
          physicsp.html
          chemp.html
          crsp.html
          englishp.html
          literaturep.html
          mathematicsp.html
          governmentp.html
          economicsp.html
          accountingp.html
          oau.html
          notification.html
          abu.html
          futa.html
          unilorin.html
          unizik.html
          password.js
          credit.html
          timetable1.jpg
          timetable2.jpg
          quiz1.html
          quiz.html
          quiz2.html
          quiz2-intelligence-v5.js
          quiz2-engines-v7.js
          quiz2-logic-v8.js
          video.mp4
          firebase-config.js
          multiplayer.js
          singleplay.js
          quiz2-chat.js
          quiz2-studio-v3.js
          quiz2-nexus-engine-v2.js
          quiz2-communication-hub.js
          quiz2-communication-v4.js
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/esi-shell.txt
          while IFS= read -r file; do [ -z "$file" ] && continue; test -f "$file" || { echo "Missing required shell file: $file"; exit 1; }; done < /tmp/esi-shell.txt
          rsync -a --files-from=/tmp/esi-shell.txt ./ android/app/src/main/assets/site/
          cp -f logo.jpg android/app/src/main/res/drawable/logo.jpg
      - name: Activate Quiz Studio engines inside APK shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/assets/site/quiz2.html'); s=p.read_text(encoding='utf-8')
          tags=[('ESI_APK_QUIZ2_ENGINES_V7','quiz2-engines-v7.js'),('ESI_APK_QUIZ2_LOGIC_V8','quiz2-logic-v8.js')]
          for marker,src in tags:
              if marker not in s:
                  block=f'\n<!-- {marker} -->\n<script src="{src}"></script>\n'
                  s=s.replace('</body>',block+'</body>',1) if '</body>' in s else s+block
          p.write_text(s,encoding='utf-8')
          for marker,src in tags:
              assert marker in s and Path('android/app/src/main/assets/site/'+src).is_file()
          print('Verified Quiz Studio V7 + V8 engines in APK shell.')
          PY
      - name: Apply targeted Android WebView image-file access fix
        shell: bash
        run: |
          set -euo pipefail
          TARGET="android/app/src/main/java/com/elitescholarinstitute/app/MainActivity.kt"; test -f "$TARGET"
          if grep -q 'allowContentAccess = false' "$TARGET"; then sed -i 's/allowContentAccess = false/allowContentAccess = true/' "$TARGET"; fi
          if grep -q 'allowFileAccess = false' "$TARGET"; then sed -i 's/allowFileAccess = false/allowFileAccess = true/' "$TARGET"; fi
          sed -i 's/ESIAndroid\/4\.0/ESIAndroid\/4.3/g' "$TARGET"
          grep -q 'allowContentAccess = true' "$TARGET"; grep -q 'allowFileAccess = true' "$TARGET"; grep -q 'ESIAndroid/4.3' "$TARGET"
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Build ESI APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK and embedded version
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk; mkdir -p release; cp android/app/build/outputs/apk/debug/app-debug.apk release/ESI.apk
          SDK_AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1); BADGING=$("$SDK_AAPT2" dump badging release/ESI.apk); echo "$BADGING"
          EXPECTED_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' android/app/build.gradle.kts | head -1); EXPECTED_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          test -n "$EXPECTED_CODE"; test -n "$EXPECTED_NAME"; echo "Expected APK version: code=$EXPECTED_CODE name=$EXPECTED_NAME"
          echo "$BADGING" | grep -E "package: name='com.elitescholarinstitute.app'.*versionCode='$EXPECTED_CODE'.*versionName='$EXPECTED_NAME'"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with: {name: ESI-APK-v4.9, path: release/ESI.apk, if-no-files-found: error, retention-days: 30}
      - name: Publish current APK release
        env: {GH_TOKEN: ${{ github.token }}}
        shell: bash
        run: |
          set -euo pipefail
          TAG="esi-v4.9-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          gh release create "$TAG" release/ESI.apk --title "ESI Android APK v4.9" --notes "ESI Android APK v4.9 with Quiz Studio V7/V8 engines." --latest
      - name: Confirm successful release
        shell: bash
        run: echo "ESI APK built, version-verified, and published as the latest release asset."