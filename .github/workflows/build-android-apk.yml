name: Elite Scholar Institute Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'app.js'
      - 'sw.js'
      - 'manifest.json'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-main
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/ESI.apk
          ls -lh release/ESI.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESI-APK
          path: release/ESI.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          gh release create "$TAG" release/ESI.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ESI Android APK" \
            --notes "ESI Android APK built from commit ${GITHUB_SHA}."
