name: Build Elite Scholar Institute APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'app.js'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EliteScholarInstitute.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EliteScholarInstitute-36.2306-debug
          path: EliteScholarInstitute.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-36.2306-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" EliteScholarInstitute.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Elite Scholar Institute Android 36.2306" \
            --notes "Android APK build for Elite Scholar Institute."
