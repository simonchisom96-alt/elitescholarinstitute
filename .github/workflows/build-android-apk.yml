name: Elite Scholar Institute Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'app.js'
      - 'sw.js'
      - 'downloader.js'
      - 'manifest.json'
      - 'quiz2.html'
      - 'quiz2-*.js'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-main
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and align current JS build versions
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/const BUILD = '[^']*'/const BUILD = '36.2404'/" app.js
          sed -i "s/esi-cache-[0-9.]*/esi-cache-36.2404/" sw.js
          sed -i "s/esi-pdf-cache-[0-9.]*/esi-pdf-cache-36.2404/" downloader.js
          grep -m1 "const BUILD" app.js
          grep -m1 "CACHE_VERSION" sw.js
          grep -m1 "CACHE_NAME" downloader.js
          grep -E "versionCode|versionName" android/app/build.gradle.kts
          test -f Englishtextbook.html
          test -f quiz2.html
          test -f quiz2-chat.js
          test -f quiz2-studio-v3.js
          test -f quiz2-communication-hub.js
          test -f quiz2-communication-v4.js

      - name: Bundle defined ESI offline shell
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/site
          cat > /tmp/esi-shell.txt <<'EOF'
          index.html
          logo.jpg
          advert.png
          esi.jpg
          founder.jpg
          manifest.json
          offline.html
          app.js
          downloader.js
          Textbooks.html
          uniben.html
          crstextbook.html
          literaturetextbook.html
          postutme.html
          buk.html
          imsu.html
          oou.html
          eksu.html
          esut.html
          lautech.html
          aaua.html
          syllables.html
          Grace.jpg
          Chuka.jpg
          325.jpg
          339.jpg
          faloke.jpg
          emma.jpg
          uniport.html
          unijos.html
          unimed.html
          unical.html
          yabatech.html
          oauth.html
          luth.html
          delsu.html
          governmenttextbook.html
          Englishtextbook.html
          biologytextbook.html
          chemistrytextbook.html
          economicstextbook.html
          physicstextbook.html
          mathematicstextbook.html
          motivation.html
          chapter2.html
          chapter3.html
          chapter4.html
          chapter5.html
          chapter6.html
          chapter7.html
          chapter8.html
          chapter9.html
          chapter10.html
          furthermathstextbook.html
          accountingtextbook.html
          motivation2.html
          motivation3.html
          biop.html
          motivatio.html
          uip.html
          ulp.html
          picture.html
          motivation4.html
          unn.html
          physicsp.html
          chemp.html
          crsp.html
          englishp.html
          literaturep.html
          mathematicsp.html
          governmentp.html
          economicsp.html
          accountingp.html
          oau.html
          notification.html
          abu.html
          futa.html
          unilorin.html
          unizik.html
          password.js
          credit.html
          timetable1.jpg
          timetable2.jpg
          quiz1.html
          quiz.html
          quiz2.html
          video.mp4
          firebase-config.js
          multiplayer.js
          singleplay.js
          quiz2-chat.js
          quiz2-studio-v3.js
          quiz2-nexus-v2.js
          quiz2-production.js
          quiz2-communication-hub.js
          quiz2-communication-v4.js
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/esi-shell.txt
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            test -f "$file" || { echo "Missing required shell file: $file"; exit 1; }
          done < /tmp/esi-shell.txt
          rsync -a --files-from=/tmp/esi-shell.txt ./ android/app/src/main/assets/site/
          cp -f logo.jpg android/app/src/main/res/drawable/logo.jpg

      - name: Activate Quiz Studio product layer inside APK shell only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/assets/site/quiz2.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- ESI_APK_QUIZ2_MODULES_V4 -->'
          tags='''\n<!-- ESI_APK_QUIZ2_MODULES_V4 -->\n<script src="quiz2-communication-v4.js"></script>\n<script src="quiz2-communication-hub.js"></script>\n<script src="quiz2-chat.js"></script>\n<script src="quiz2-studio-v3.js"></script>\n<script src="quiz2-nexus-v2.js"></script>\n<script src="quiz2-production.js"></script>\n'''
          if marker not in s:
              if '</body>' in s:
                  s=s.replace('</body>',tags+'</body>',1)
              else:
                  s += tags
          p.write_text(s,encoding='utf-8')
          assert marker in s
          for name in ['quiz2-communication-v4.js','quiz2-communication-hub.js','quiz2-chat.js','quiz2-studio-v3.js','quiz2-nexus-v2.js','quiz2-production.js']:
              assert Path('android/app/src/main/assets/site/'+name).is_file(), name
          print('Verified APK-only Quiz Studio module injection.')
          PY

      - name: Apply targeted Android WebView image-file access fix
        shell: bash
        run: |
          set -euo pipefail
          TARGET="android/app/src/main/java/com/elitescholarinstitute/app/MainActivity.kt"
          test -f "$TARGET"
          grep -q 'allowContentAccess = false' "$TARGET"
          grep -q 'allowFileAccess = false' "$TARGET"
          sed -i 's/allowContentAccess = false/allowContentAccess = true/' "$TARGET"
          sed -i 's/allowFileAccess = false/allowFileAccess = true/' "$TARGET"
          sed -i 's/ESIAndroid\/4\.0/ESIAndroid\/4.3/' "$TARGET"
          grep -q 'allowContentAccess = true' "$TARGET"
          grep -q 'allowFileAccess = true' "$TARGET"
          grep -q 'ESIAndroid/4.3' "$TARGET"
          echo "Verified targeted Android WebView file-input access fix."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build ESI APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK and embedded version
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/ESI.apk
          echo "APK SHA-256: $(sha256sum release/ESI.apk | cut -d' ' -f1)"
          echo "APK bytes: $(wc -c < release/ESI.apk)"
          SDK_AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          BADGING=$("$SDK_AAPT2" dump badging release/ESI.apk)
          echo "$BADGING"
          EXPECTED_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' android/app/build.gradle.kts | head -1)
          EXPECTED_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          test -n "$EXPECTED_CODE"
          test -n "$EXPECTED_NAME"
          echo "Expected APK version: code=$EXPECTED_CODE name=$EXPECTED_NAME"
          echo "$BADGING" | grep -E "package: name='com.elitescholarinstitute.app'.*versionCode='$EXPECTED_CODE'.*versionName='$EXPECTED_NAME'"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESI-APK-v4.7
          path: release/ESI.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish current APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="esi-v4.7-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          gh release create "$TAG" release/ESI.apk \
            --title "ESI Android APK v4.7" \
            --notes "ESI Android APK v4.7. Built from commit ${GITHUB_SHA}. Quiz Studio communication modules are bundled and activated in the APK shell." \
            --latest

      - name: Confirm successful release
        shell: bash
        run: echo "ESI v4.7 APK built, version-verified, and published as the latest release asset."