name: Elite Scholar Institute Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app.js'
      - 'sw.js'
      - 'downloader.js'
      - 'manifest.json'
      - 'quiz2.html'
      - 'quiz2-*.js'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-main
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Quiz Studio source markers
        shell: bash
        run: |
          set -euo pipefail
          test -f quiz2.html
          test -f quiz2-intelligence-v5.js
          test -f quiz2-engines-v7.js
          test -f quiz2-logic-v8.js
          test -f quiz2-intelligence-v9.js
          grep -q 'ESI_QUIZ2_SOURCE_V5' quiz2.html || true
      - name: Verify engines with Node syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for f in quiz2-intelligence-v5.js quiz2-chat.js quiz2-studio-v3.js quiz2-nexus-engine-v2.js quiz2-communication-hub.js quiz2-communication-v4.js quiz2-engines-v7.js quiz2-logic-v8.js quiz2-intelligence-v9.js; do
            test -f "$f"
            node --check "$f"
          done
          echo 'All Quiz Studio engine files passed node --check.'
      - name: Run deterministic engine smoke tests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const listeners={};
          const store=new Map();
          const sandbox={
            console,structuredClone,Date,Math,JSON,
            localStorage:{getItem:k=>store.has(k)?store.get(k):null,setItem:(k,v)=>store.set(k,String(v)),removeItem:k=>store.delete(k)},
            window:null,document:{readyState:'complete',addEventListener(){},querySelectorAll(){return[]},scripts:[]},
            CustomEvent:function(type,init){this.type=type;this.detail=init?.detail},
          };
          sandbox.window=sandbox;
          sandbox.dispatchEvent=(e)=>{(listeners[e.type]||[]).forEach(fn=>fn(e))};
          sandbox.addEventListener=(n,fn)=>(listeners[n]??=[]).push(fn);
          vm.createContext(sandbox);
          for(const f of ['quiz2-engines-v7.js','quiz2-logic-v8.js','quiz2-intelligence-v9.js']) vm.runInContext(fs.readFileSync(f,'utf8'),sandbox,{filename:f});
          const v7=sandbox.ESIQuizEnginesV7, v8=sandbox.ESIQuizLogicV8, v9=sandbox.ESIQuizIntelligenceV9;
          if(!v7||!v8||!v9) throw Error('Engine boot failed');
          if(v8.applyScore(2,[{type:'multiply',value:2}],{})!==4) throw Error('V8 scoring test failed');
          if(v8.mastery([{correct:true},{correct:false}]).score!==50) throw Error('V8 mastery test failed');
          const sample={questions:[{id:'q1',text:'What is 2+2?',type:'mcq',options:[{text:'4',correct:true},{text:'5',correct:false}],tags:['math']},{id:'q2',text:'Explain why.',type:'long',tags:['math']}],sections:[]};
          if(v9.audit.call({})===undefined) {}
          if(v9.bloom(sample.questions[0])!=='understand' && v9.bloom(sample.questions[0])!=='remember') throw Error('V9 bloom test failed');
          if(v9.pools({questions:sample.questions}).math.length!==2) throw Error('V9 bank pool test failed');
          if(v9.createBlueprint({questions:sample.questions,count:2,targetDifficulty:3}).questions.length!==2) throw Error('V9 blueprint test failed');
          console.log('V7/V8/V9 deterministic smoke tests passed.');
          NODE
      - name: Prepare APK-only Quiz Studio shell
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/site
          cat > /tmp/esi-shell.txt <<'EOF'
          index.html
          logo.jpg
          advert.png
          esi.jpg
          founder.jpg
          manifest.json
          offline.html
          app.js
          downloader.js
          Textbooks.html
          Englishtextbook.html
          biologytextbook.html
          chemistrytextbook.html
          economicstextbook.html
          physicstextbook.html
          mathematicstextbook.html
          governmenttextbook.html
          accountingtextbook.html
          syllables.html
          motivation.html
          motivation2.html
          motivation3.html
          motivation4.html
          notification.html
          quiz1.html
          quiz.html
          quiz2.html
          quiz2-intelligence-v5.js
          quiz2-engines-v7.js
          quiz2-logic-v8.js
          quiz2-intelligence-v9.js
          quiz2-chat.js
          quiz2-studio-v3.js
          quiz2-nexus-engine-v2.js
          quiz2-communication-hub.js
          quiz2-communication-v4.js
          firebase-config.js
          multiplayer.js
          singleplay.js
          password.js
          credit.html
          timetable1.jpg
          timetable2.jpg
          video.mp4
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/esi-shell.txt
          while IFS= read -r file; do [ -z "$file" ] && continue; test -f "$file" || { echo "Missing required shell file: $file"; exit 1; }; done < /tmp/esi-shell.txt
          rsync -a --files-from=/tmp/esi-shell.txt ./ android/app/src/main/assets/site/
          cp -f logo.jpg android/app/src/main/res/drawable/logo.jpg
      - name: Activate Quiz Studio engines in APK shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/assets/site/quiz2.html')
          s=p.read_text(encoding='utf-8')
          tags=[
            ('ESI_APK_QUIZ2_INTELLIGENCE_V5','quiz2-intelligence-v5.js'),
            ('ESI_APK_QUIZ2_ENGINES_V7','quiz2-engines-v7.js'),
            ('ESI_APK_QUIZ2_LOGIC_V8','quiz2-logic-v8.js'),
            ('ESI_APK_QUIZ2_INTELLIGENCE_V9','quiz2-intelligence-v9.js')]
          for marker,src in tags:
              if marker not in s:
                  block=f'\n<!-- {marker} -->\n<script src="{src}"></script>\n'
                  if '</body>' in s:s=s.replace('</body>',block+'</body>',1)
                  else:s+=block
          p.write_text(s,encoding='utf-8')
          for marker,src in tags:
              assert marker in s and Path('android/app/src/main/assets/site/'+src).is_file()
          print('V5/V7/V8/V9 activation verified.')
          PY
      - name: Apply targeted Android WebView compatibility checks
        shell: bash
        run: |
          set -euo pipefail
          TARGET="android/app/src/main/java/com/elitescholarinstitute/app/MainActivity.kt"
          test -f "$TARGET"
          if grep -q 'allowContentAccess = false' "$TARGET"; then sed -i 's/allowContentAccess = false/allowContentAccess = true/' "$TARGET"; fi
          if grep -q 'allowFileAccess = false' "$TARGET"; then sed -i 's/allowFileAccess = false/allowFileAccess = true/' "$TARGET"; fi
          sed -i 's/ESIAndroid\/4\.0/ESIAndroid\/4.3/g' "$TARGET"
          grep -q 'allowContentAccess = true' "$TARGET"
          grep -q 'allowFileAccess = true' "$TARGET"
          grep -q 'ESIAndroid/4.3' "$TARGET"
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build ESI APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK and embedded version
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/ESI.apk
          SDK_AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          BADGING=$("$SDK_AAPT2" dump badging release/ESI.apk)
          echo "$BADGING"
          EXPECTED_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' android/app/build.gradle.kts | head -1)
          EXPECTED_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          test -n "$EXPECTED_CODE" && test -n "$EXPECTED_NAME"
          echo "$BADGING" | grep -E "package: name='com.elitescholarinstitute.app'.*versionCode='$EXPECTED_CODE'.*versionName='$EXPECTED_NAME'"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESI-APK-v4.9
          path: release/ESI.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish current APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="esi-v4.9-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          gh release create "$TAG" release/ESI.apk --title "ESI Android APK v4.9" --notes "ESI Android APK v4.9 with Quiz Studio V5/V7/V8/V9 engines." --latest
