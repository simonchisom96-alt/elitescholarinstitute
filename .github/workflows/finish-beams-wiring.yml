name: Finish Beams wiring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply only the two surgical Beams connections
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) password.js: invoke Beams only after the existing Firebase save succeeds.
          p = Path('password.js')
          text = p.read_text(encoding='utf-8')
          old = """  const ref = db.ref('notifications').push(data);\n  ref.then(()=>{\n      closeCompose();"""
          new = """  const ref = db.ref('notifications').push(data);\n  ref.then(()=>{\n      if (window.publishBeamsAnnouncement) window.publishBeamsAnnouncement(data);\n      closeCompose();"""
          if "window.publishBeamsAnnouncement" not in text:
              if old not in text:
                  raise SystemExit('Expected pushNotif block was not found; refusing to edit password.js')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          # 2) notification.html: load the tiny publisher before password.js.
          n = Path('notification.html')
          html = n.read_text(encoding='utf-8')
          if '/beams-publisher.js' not in html:
              pattern = r'(<script\b[^>]*src=["\'][^"\']*password\.js(?:\?[^"\']*)?["\'][^>]*></script>)'
              match = re.search(pattern, html, flags=re.I)
              if not match:
                  # The page already loads app.js; use the closing head as a safe fallback.
                  head_end = re.search(r'</head\s*>', html, flags=re.I)
                  if not head_end:
                      raise SystemExit('No safe insertion point found; refusing to edit notification.html')
                  injection = '    <script src="/beams-publisher.js"></script>\n'
                  html = html[:head_end.start()] + injection + html[head_end.start():]
              else:
                  injection = '    <script src="/beams-publisher.js"></script>\n'
                  html = html[:match.start()] + injection + html[match.start():]
              n.write_text(html, encoding='utf-8')

      - name: Commit the surgical wiring and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add password.js notification.html
          git commit -m "feat(beams): connect Firebase announcements to push" || true
          git rm .github/workflows/finish-beams-wiring.yml
          git commit -m "chore: remove one-time Beams wiring workflow"
          git push
