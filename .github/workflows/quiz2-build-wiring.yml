name: ESI Quiz Studio Android Wiring Verification
on:
  push:
    branches: [main]
    paths: ['quiz2-*.js','android/app/build.gradle.kts','.github/workflows/build-android-apk.yml','.github/workflows/quiz2-build-wiring.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency: {group: quiz2-build-wiring, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Quiz2 V42 and APK v5.8 wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f quiz2-polish-v32.js
          test -f .github/workflows/build-android-apk.yml
          test -f android/app/build.gradle.kts
          grep -q 'quiz2-polish-v32.js' .github/workflows/build-android-apk.yml
          grep -q "('V42','quiz2-polish-v32.js')" .github/workflows/build-android-apk.yml
          grep -q 'quiz2-polish-v32.js' .github/workflows/build-android-apk.yml
          grep -q '362418' android/app/build.gradle.kts
          grep -q '5.8' android/app/build.gradle.kts
          grep -q 'Build ESI APK v5.8' .github/workflows/build-android-apk.yml
          grep -q 'Verify APK v5.8' .github/workflows/build-android-apk.yml
          grep -q 'ESI-APK-v5.8' .github/workflows/build-android-apk.yml
          grep -q 'esi-v5.8-' .github/workflows/build-android-apk.yml
          for f in quiz2-share-v22.js quiz2-ecosystem-v24.js quiz2-api-contract-v25.js quiz2-publish-ui-v26.js quiz2-results-v27.js quiz2-social-v28.js quiz2-communication-v29.js quiz2-backend-config-v30.js quiz2-learning-v31.js quiz2-creator-admin-v32.js quiz2-media-v33.js quiz2-types-v34.js quiz2-arrangement-v35.js quiz2-runtime-v36.js quiz2-runtime-v37.js quiz2-runtime-v38.js quiz2-ai-bridge-v39.js quiz2-import-export-v40.js quiz2-integrity-analytics-v41.js quiz2-polish-v32.js; do
            test -f "$f"
            grep -q "$f" .github/workflows/build-android-apk.yml
          done
          echo 'Quiz2 V42 and APK v5.8 wiring verified.'
