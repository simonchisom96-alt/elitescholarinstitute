name: ESI Quiz Studio Android Wiring Repair
on:
  push:
    branches: [main]
    paths: ['quiz2-*.js','android/app/build.gradle.kts','.github/workflows/build-android-apk.yml','.github/workflows/quiz2-build-wiring.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: quiz2-build-wiring, cancel-in-progress: false}
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair Android build wiring and version contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-android-apk.yml'); s=p.read_text(encoding='utf-8')
          # V42 lives in the existing quiz2-polish-v32.js filename because quiz2.html already loads it.
          if 'quiz2-polish-v32.js' not in s:
              anchor="          quiz2-communication-v29.js"
              s=s.replace(anchor,"          quiz2-polish-v32.js\\n"+anchor,1)
          modules=['quiz2-share-v22.js','quiz2-ecosystem-v24.js','quiz2-api-contract-v25.js','quiz2-publish-ui-v26.js','quiz2-results-v27.js','quiz2-social-v28.js','quiz2-communication-v29.js','quiz2-backend-config-v30.js','quiz2-learning-v31.js','quiz2-creator-admin-v32.js','quiz2-media-v33.js','quiz2-types-v34.js','quiz2-arrangement-v35.js','quiz2-runtime-v36.js','quiz2-runtime-v37.js','quiz2-runtime-v38.js','quiz2-ai-bridge-v39.js','quiz2-import-export-v40.js','quiz2-integrity-analytics-v41.js','quiz2-polish-v32.js']
          # Ensure every upgraded JS is included in the APK shell file list.
          for f in modules:
              if f not in s:
                  anchor='          quiz2-communication-v29.js'
                  if anchor in s:s=s.replace(anchor,'          '+f+'\\n'+anchor,1)
          # Ensure the activation contract knows about the final V42 builder layer.
          if "('V42','quiz2-polish-v32.js')" not in s:
              marker="tags=[('V5'"
              s=s.replace(marker,"tags=[('V42','quiz2-polish-v32.js'),('V5'",1)
          # Keep the release contract monotonic: v5.6 / 362416 -> v5.7 / 362417.
          for old_code in ('362414','362415','362416'):
              s=s.replace('versionCode = '+old_code,'versionCode = 362417')
              s=s.replace("EXPECTED_CODE' = '"+old_code,"EXPECTED_CODE' = '362417")
          for old_name in ('5.4','5.5','5.6'):
              s=s.replace('versionName = "'+old_name+'"','versionName = "5.7"')
              s=s.replace('Build ESI APK v'+old_name,'Build ESI APK v5.7')
              s=s.replace('Verify APK v'+old_name,'Verify APK v5.7')
              s=s.replace('ESI-APK-v'+old_name,'ESI-APK-v5.7')
              s=s.replace('esi-v'+old_name+'-','esi-v5.7-')
              s=s.replace('ESI Android APK v'+old_name,'ESI Android APK v5.7')
          s=s.replace("test \"$EXPECTED_CODE\" = '362416'","test \"$EXPECTED_CODE\" = '362417'")
          s=s.replace("test \"$EXPECTED_NAME\" = '5.6'","test \"$EXPECTED_NAME\" = '5.7'")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f quiz2-polish-v32.js
          grep -q 'quiz2-polish-v32.js' .github/workflows/build-android-apk.yml
          grep -q "('V42','quiz2-polish-v32.js')" .github/workflows/build-android-apk.yml
          for f in quiz2-share-v22.js quiz2-ecosystem-v24.js quiz2-api-contract-v25.js quiz2-publish-ui-v26.js quiz2-results-v27.js quiz2-social-v28.js quiz2-communication-v29.js quiz2-backend-config-v30.js quiz2-learning-v31.js quiz2-creator-admin-v32.js quiz2-media-v33.js quiz2-types-v34.js quiz2-arrangement-v35.js quiz2-runtime-v36.js quiz2-runtime-v37.js quiz2-runtime-v38.js quiz2-ai-bridge-v39.js quiz2-import-export-v40.js quiz2-integrity-analytics-v41.js; do grep -q "$f" .github/workflows/build-android-apk.yml; done
          grep -q '362417' .github/workflows/build-android-apk.yml
          grep -q '5.7' .github/workflows/build-android-apk.yml
          grep -q 'Build ESI APK v5.7' .github/workflows/build-android-apk.yml
          grep -q 'Verify APK v5.7' .github/workflows/build-android-apk.yml
      - name: Commit repair only when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/build-android-apk.yml; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-android-apk.yml
          git commit -m 'fix(build): wire Quiz2 V42 and APK v5.7 contract'
          git push origin main
