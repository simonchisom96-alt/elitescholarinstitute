function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';document.documentElement.classList.toggle('light',state.theme==='light');document.getElementById('themeToggle').classList.toggle('on',state.theme==='light');silent()}
function toggleCompact(){state.compact=!state.compact;document.getElementById('compactToggle').classList.toggle('on',state.compact);document.body.style.fontSize=state.compact?'95%':'';silent()}
function go(page){window.page=page;document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick')?.includes("'"+page+"'")));document.querySelectorAll('.bottom button').forEach((b,i)=>b.classList.toggle('active',page==='home'&&i===0||page==='builder'&&i===1||page==='ai'&&i===2||page==='bank'&&i===3||page==='design'&&i===4||page==='advanced'&&i===5));render(page);window.scrollTo({top:0,behavior:'smooth'})}
function render(page){const m=document.getElementById('main');if(page==='home')return home(m);if(page==='builder')return builder(m);if(page==='ai')return ai(m);if(page==='bank')return bank(m);if(page==='design')return design(m);if(page==='media')return media(m);if(page==='live')return live(m);if(page==='analytics')return analytics(m);advanced(m)}
function home(m){m.innerHTML=`<section class="hero"><h1>Build your <span>perfect quiz.</span></h1><p>Welcome to the ESI creator workspace. This is the public-facing quiz maker shell: polished, mobile-first, no exposed API keys, with the full blueprint represented as one expandable creator system.</p><div class="heroactions"><button class="btn gold" onclick="newQuiz()">＋ New Quiz</button><button class="btn blue" onclick="go('builder')">Open Builder</button><button class="btn" onclick="go('ai')">✦ AI Studio</button><button class="btn" onclick="openTemplates()">Template Gallery</button></div></section><div class="dashgrid"><div class="stat"><b>${state.questions.length}</b><span>Questions</span></div><div class="stat"><b>${state.questions.reduce((a,q)=>a+(+q.points||1),0)}</b><span>Total points</span></div><div class="stat"><b>${state.bank.length}</b><span>Bank items</span></div><div class="stat"><b>${featureGroups.length+novel.length}</b><span>Blueprint capabilities</span></div></div><section class="panel"><div class="paneltitle"><div><h2>Start creating</h2><p>Choose the workflow you need.</p></div></div><div class="quick"><button class="quickcard" onclick="go('builder')"><em>▣</em><strong>Manual Builder</strong><span>SurveyHeart-style authoring, sections, question cards, ordering, points, answer keys and preview.</span></button><button class="quickcard" onclick="go('ai')"><em>✦</em><strong>AI Quiz Studio</strong><span>Topic, text, documents, webpage, video, OCR and voice generation adapters with keys kept off the public page.</span></button><button class="quickcard" onclick="go('bank')"><em>▤</em><strong>Question Bank</strong><span>Reuse, tag, search, remix, clone and prepare a public library.</span></button><button class="quickcard" onclick="go('design')"><em>◈</em><strong>Design Studio</strong><span>Blue-and-gold ESI branding, bright/dark themes, covers, templates and accessibility controls.</span></button><button class="quickcard" onclick="go('media')"><em>▧</em><strong>Media Lab</strong><span>Image, audio, video, 45 image-question patterns and future storage/viewer adapters.</span></button><button class="quickcard" onclick="go('live')"><em>●</em><strong>Live & Async</strong><span>Rooms, QR join, host controls, teams, leaderboards, homework and adaptive play architecture.</span></button></div></section><section class="panel"><div class="paneltitle"><div><h2>Creator checklist</h2><p>Everything is prepared as UI/data contracts before the raw engines are wired.</p></div><span class="chip active">Single-file</span></div><div class="featurelist">${featureGroups.slice(0,10).map(x=>`<div class="feature"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></section>`}
function newQuiz(){if(state.questions.length&&!confirm('Start a new quiz? The current draft remains saved only if you export it first.'))return;state.title='Untitled Quiz';state.description='Create an engaging quiz with ESI Creator Studio.';state.questions=[];state.sections=[];silent();go('builder');toast('New quiz ready')}
function builder(m){m.innerHTML=`<div class="panel"><div class="paneltitle"><div><h2>Quiz Builder</h2><p>Arrange content the way creators expect: title → questions → settings → preview → publish.</p></div><div class="heroactions"><button class="btn" onclick="addSection()">＋ Section</button><button class="btn blue" onclick="addQuestion()">＋ Question</button><button class="btn gold" onclick="save()">Save</button></div></div></div><div class="workspace"><aside class="toolbox"><h3>Question types</h3><div class="toolsearch"><input class="input" placeholder="Find a type..." oninput="filterTools(this.value)"></div><div id="tools">${Object.entries(types).slice(0,25).map(([k,v])=>`<button class="tool" data-name="${esc(v.toLowerCase())}" onclick="addQuestion('${k}')"><b>＋</b>${v}</button>`).join('')}</div></aside><section class="canvas"><div class="canvasbar"><button class="chip active" onclick="builder()">Questions</button><button class="chip" onclick="go('design')">Design</button><button class="chip" onclick="go('media')">Media</button><button class="chip" onclick="go('bank')">Bank</button><button class="chip" onclick="go('advanced')">All features</button></div><div class="quizcover"><input id="quizTitle" class="input" value="${esc(state.title)}" oninput="state.title=this.value;silent()"><textarea id="quizDesc" class="input" placeholder="Quiz description..." oninput="state.description=this.value;silent()">${esc(state.description)}</textarea></div>${state.sections.map((s,i)=>`<div class="section"><b>SECTION ${i+1}</b><input class="input" value="${esc(s.title)}" oninput="state.sections[${i}].title=this.value;silent()"><input class="input" value="${esc(s.description||'')}" placeholder="Section instructions" oninput="state.sections[${i}].description=this.value;silent()"></div>`).join('')}${state.questions.length?state.questions.map((q,i)=>questionCard(q,i)).join(''):`<div class="panel" style="text-align:center;padding:42px"><h2 style="margin:0 0 5px">Your canvas is ready</h2><p style="color:var(--muted);font-size:9px">Add your first question, then keep building. No API keys are required on this public page.</p><button class="btn blue" onclick="addQuestion()">＋ Add first question</button></div>`}</section><aside class="properties"><h3>Quiz settings</h3><div class="propertyrow"><label>Mode</label><select class="input" onchange="state.mode=this.value;silent()"><option ${state.mode==='classic'?'selected':''}>classic</option><option ${state.mode==='async'?'selected':''}>async</option><option ${state.mode==='live'?'selected':''}>live</option><option ${state.mode==='adaptive'?'selected':''}>adaptive</option><option ${state.mode==='practice'?'selected':''}>practice</option><option ${state.mode==='poll'?'selected':''}>poll</option></select></div><div class="propertyrow"><label>Time limit (minutes)</label><input class="input" type="number" value="${state.settings.time}" oninput="state.settings.time=+this.value||0;silent()"></div><div class="propertyrow"><label>Passing score %</label><input class="input" type="number" value="${state.settings.pass}" oninput="state.settings.pass=+this.value||0;silent()"></div>${['showScore','showAnswers','showExplain','randomQ','randomA','back','anonymous','leaderboard'].map(k=>`<label class="check"><input type="checkbox" ${state.settings[k]?'checked':''} onchange="state.settings.${k}=this.checked;silent()">${labelSetting(k)}</label>`).join('')}<button class="btn green" style="width:100%;margin-top:8px" onclick="preview()">▶ Student Preview</button><button class="btn" style="width:100%;margin-top:5px" onclick="exportJSON()">⇩ Export JSON</button></aside></div>`}
function labelSetting(k){return ({showScore:'Show score',showAnswers:'Show correct answers',showExplain:'Show explanations',randomQ:'Randomize questions',randomA:'Randomize answers',back:'Allow back navigation',anonymous:'Allow anonymous responses',leaderboard:'Live leaderboard hook'})[k]}
function filterTools(v){document.querySelectorAll('#tools .tool').forEach(x=>x.style.display=x.dataset.name.includes(v.toLowerCase())?'block':'none')}
function questionCard(q,i){const meta=types[q.type]||q.type;let body='';if(['multiple_choice','multiple_select','true_false','yes_no','poll','ordering'].includes(q.type)){body=(q.options||[]).map((o,j)=>`<div class="optionrow"><input class="correct" type="${q.type==='multiple_select'?'checkbox':'radio'}" name="c_${q.id}" ${o.correct?'checked':''} onchange="setCorrect('${q.id}',${j},${q.type==='multiple_select'})"><input class="input" value="${esc(o.text)}" placeholder="Option ${j+1}" oninput="setOption('${q.id}',${j},this.value)"><button class="icon" onclick="removeOption('${q.id}',${j})">×</button></div>`).join('')+`<button class="tiny" onclick="addOption('${q.id}')">＋ Add option</button>`}else if(q.type==='matching'){body=(q.pairs||[]).map((p,j)=>`<div class="optionrow"><input class="input" value="${esc(p.left)}" placeholder="Left" oninput="setPair('${q.id}',${j},'left',this.value)"><input class="input" value="${esc(p.right)}" placeholder="Match" oninput="setPair('${q.id}',${j},'right',this.value)"></div>`).join('')+`<button class="tiny" onclick="addPair('${q.id}')">＋ Pair</button>`}else if(q.type.startsWith('image')||['hotspot','multi_hotspot','drag_label','image_occlusion','annotation','panorama','geolocation','comparative','mental_rotation','ar_anchor','silhouette','puzzle','xray','freeze_sequence','art_era','scavenger','spot_edit','rebus','colorization','depth','gif_clue','drawing_race','described','historical_map','progressive','zoom_guess','spot_difference','before_after','diagram'].includes(q.type)){body=`<div class="propertyrow"><label>Media / image source</label><input class="input" value="${esc(q.media||'')}" placeholder="Media will connect to storage layer" oninput="q.media=this.value;silent()"></div><div class="propertyrow"><label>Interaction data</label><input class="input" value="${esc(q.interaction||'')}" placeholder="Coordinates, targets, layers or sequence data" oninput="q.interaction=this.value;silent()"></div>`}else{body=`<div class="propertyrow"><label>Expected answer / grading rule</label><input class="input" value="${esc(q.answer||'')}" placeholder="Answer, rubric, formula or rule" oninput="q.answer=this.value;silent()"></div>`}return `<article class="question"><div class="qtop"><div class="qbadge">${i+1}</div><div class="qtype">${esc(meta)}</div><button class="icon" onclick="moveQ(${i},-1)">↑</button><button class="icon" onclick="moveQ(${i},1)">↓</button><button class="icon" onclick="duplicateQ(${i})">⧉</button><button class="icon" onclick="deleteQ('${q.id}')">×</button></div><textarea class="input" placeholder="Type your question..." oninput="state.questions[${i}].text=this.value;silent()">${esc(q.text)}</textarea>${body}<div class="qfoot"><label>Required <input type="checkbox" ${q.required?'checked':''} onchange="qRequired('${q.id}',this.checked)"></label><label>Points <input style="width:50px" class="input" type="number" value="${q.points}" onchange="state.questions[${i}].points=+this.value||0;silent()"></label><button class="tiny" onclick="changeType('${q.id}')">Change type</button><button class="tiny" onclick="saveToBank('${q.id}')">Save to bank</button><button class="tiny" onclick="toggleMore('${q.id}')">More</button></div><div id="more_${q.id}" class="hidden" style="margin-top:8px"><textarea class="input" placeholder="Explanation shown after answering..." oninput="updateQ('${q.id}','explanation',this.value)">${esc(q.explanation)}</textarea><input class="input" style="margin-top:5px" value="${esc(q.hint)}" placeholder="Hint" oninput="updateQ('${q.id}','hint',this.value)"><input class="input" style="margin-top:5px" value="${esc((q.tags||[]).join(', '))}" placeholder="Tags" oninput="updateQ('${q.id}','tags',this.value.split(',').map(x=>x.trim()).filter(Boolean))"></div></article>`}
function makeQ(type='multiple_choice'){const fixed=type==='true_false'?['True','False']:type==='yes_no'?['Yes','No']:null;return{id:id(),type,text:'',points:1,required:false,explanation:'',hint:'',tags:[],answer:'',media:'',interaction:'',options:fixed?fixed.map((x,i)=>({text:x,correct:i===0})):['multiple_choice','multiple_select','poll','ordering'].includes(type)?[{text:'',correct:true},{text:'',correct:false},{text:'',correct:false},{text:'',correct:false}]:[],pairs:type==='matching'?[{left:'',right:''},{left:'',right:''}]:[]}}
function addQuestion(type='multiple_choice'){state.questions.push(makeQ(type));silent();builder();setTimeout(()=>document.querySelector('.question:last-of-type textarea')?.focus(),50)}
function addSection(){state.sections.push({id:id('s'),title:'New Section',description:''});silent();builder()}
function deleteQ(idv){state.questions=state.questions.filter(q=>q.id!==idv);silent();builder()}
function duplicateQ(i){const q=JSON.parse(JSON.stringify(state.questions[i]));q.id=id();q.options=(q.options||[]).map(o=>({...o}));state.questions.splice(i+1,0,q);silent();builder()}
function moveQ(i,d){const n=i+d;if(n<0||n>=state.questions.length)return;[state.questions[i],state.questions[n]]=[state.questions[n],state.questions[i]];silent();builder()}
function qRequired(idv,v){const q=state.questions.find(q=>q.id===idv);if(q)q.required=v;silent()}
function updateQ(idv,k,v){const q=state.questions.find(q=>q.id===idv);if(q){q[k]=v;silent()}}
function setOption(idv,j,v){const q=state.questions.find(q=>q.id===idv);if(q?.options[j]){q.options[j].text=v;silent()}}
function setCorrect(idv,j,m){const q=state.questions.find(q=>q.id===idv);if(!q)return;if(m)q.options[j].correct=!q.options[j].correct;else q.options.forEach((o,k)=>o.correct=k===j);silent()}
function addOption(idv){const q=state.questions.find(q=>q.id===idv);if(q){q.options.push({text:'',correct:false});silent();builder()}}
function removeOption(idv,j){const q=state.questions.find(q=>q.id===idv);if(q){q.options.splice(j,1);silent();builder()}}
function addPair(idv){const q=state.questions.find(q=>q.id===idv);if(q){q.pairs.push({left:'',right:''});silent();builder()}}
function setPair(idv,j,k,v){const q=state.questions.find(q=>q.id===idv);if(q?.pairs[j]){q.pairs[j][k]=v;silent()}}
function changeType(idv){const q=state.questions.find(q=>q.id===idv);if(!q)return;const ks=Object.keys(types),n=(ks.indexOf(q.type)+1)%ks.length;q.type=ks[n];q.options=[];q.pairs=[];silent();builder();toast('Type changed to '+types[q.type])}
function toggleMore(idv){document.getElementById('more_'+idv)?.classList.toggle('hidden')}
function ai(m){m.innerHTML=`<section class="hero"><h1>✦ AI <span>Studio</span></h1><p>The public page never asks visitors to paste provider API keys. The UI only collects safe generation inputs. Provider credentials belong behind a Worker/server secret when the raw engine is connected.</p></section><section class="panel"><div class="paneltitle"><div><h2>Generate a quiz</h2><p>One workspace for every source in the blueprint.</p></div></div><div class="featurelist"><div class="feature"><b>Topic generation</b><span>Prompt → structured questions with difficulty, Bloom level, distractors and explanations.</span><button class="btn blue" style="margin-top:8px" onclick="aiDemo('topic')">Create from topic</button></div><div class="feature"><b>Paste text</b><span>Paste notes, lessons or a syllabus and prepare a quiz draft.</span><button class="btn blue" style="margin-top:8px" onclick="aiDemo('text')">Create from text</button></div><div class="feature"><b>Document / PDF / PPTX</b><span>Upload source later through the secure media/Worker pipeline.</span><button class="btn" style="margin-top:8px" onclick="toast('Document engine is staged for the secure Worker layer')">Choose file</button></div><div class="feature"><b>Web / YouTube</b><span>URL ingestion adapter prepared without exposing credentials.</span><button class="btn" style="margin-top:8px" onclick="openInput('source')">Enter source URL</button></div><div class="feature"><b>Photo / OCR</b><span>Textbook photo → OCR → question generation pipeline.</span><button class="btn" style="margin-top:8px" onclick="toast('Camera/OCR adapter staged')">Use photo</button></div><div class="feature"><b>Voice-to-quiz</b><span>Browser speech capture can feed the same structured generation pipeline.</span><button class="btn" style="margin-top:8px" onclick="startVoice()">🎙 Speak</button></div></div></section><section class="panel"><div class="paneltitle"><div><h2>AI controls</h2><p>These are creator preferences, not secret credentials.</p></div></div><div class="featurelist"><div class="feature"><b>Difficulty</b><input class="input" type="range" min="1" max="5" value="3"><span>Easy → Expert</span></div><div class="feature"><b>Bloom level</b><select class="input"><option>Remember</option><option>Understand</option><option>Apply</option><option>Analyze</option><option>Evaluate</option><option>Create</option></select></div><div class="feature"><b>Question count</b><input class="input" type="number" min="1" max="200" value="10"></div><div class="feature"><b>Language</b><select class="input"><option>English</option><option>Igbo</option><option>Yoruba</option><option>Hausa</option><option>French</option><option>Arabic</option></select></div></div></section>`}
function aiDemo(kind){const subject=prompt(kind==='topic'?'What topic should the quiz cover?':'Paste the source text:');if(subject===null)return;if(kind==='topic'&&subject.trim())state.title=subject+' Quiz';state.description=kind==='topic'?'AI generation draft — review every answer before publishing.':'Imported source draft — review every answer before publishing.';if(!state.questions.length)for(let i=0;i<5;i++){const q=makeQ('multiple_choice');q.text='Draft question '+(i+1)+' about '+subject;q.options[0].text='Correct answer';q.options[0].correct=true;q.options[1].text='Distractor';q.options[2].text='Distractor';q.options[3].text='Distractor';state.questions.push(q)}silent();go('builder');toast('Generation draft created — review before publishing')}
function startVoice(){if(!('SpeechRecognition'in window||'webkitSpeechRecognition'in window))return toast('Speech recognition is not available in this browser');const R=window.SpeechRecognition||window.webkitSpeechRecognition,r=new R();r.lang='en-US';r.onresult=e=>{const text=e.results[0][0].transcript;state.description=text;silent();toast('Voice captured into the quiz description')};r.start();toast('Listening…')}
function bank(m){m.innerHTML=`<section class="hero"><h1>Question <span>Bank</span></h1><p>Build your reusable library locally now; the same model is ready for cloud synchronization, public packs, ratings, folders and marketplace features later.</p></section><section class="panel"><div class="paneltitle"><div><h2>Library</h2><p>${state.bank.length} saved item(s)</p></div><button class="btn blue" onclick="saveAllBank()">Save current quiz</button></div><input class="input" placeholder="Search question bank..." oninput="renderBankList(this.value)"><div id="bankList" style="margin-top:9px"></div></section>`;renderBankList('')}
function renderBankList(term){const r=document.getElementById('bankList');if(!r)return;const a=state.bank.filter(q=>(q.text||'').toLowerCase().includes(term.toLowerCase()));r.innerHTML=a.length?a.map(q=>`<div class="feature" style="margin-bottom:6px"><b>${esc(q.text||'Untitled')}</b><span>${esc(types[q.type]||q.type)} • ${q.points||1} point(s)</span><button class="tiny" style="margin-top:5px" onclick="insertBank('${q.id}')">＋ Insert</button></div>`).join(''):'<div class="feature"><b>No matching bank items</b><span>Save a question or the whole quiz to start your reusable library.</span></div>'}
function saveToBank(idv){const q=state.questions.find(q=>q.id===idv);if(q){const c=JSON.parse(JSON.stringify(q));c.id=id('bank');state.bank.unshift(c);silent();toast('Saved to question bank')}}
function saveAllBank(){state.questions.forEach(q=>{const c=JSON.parse(JSON.stringify(q));c.id=id('bank');state.bank.unshift(c)});silent();toast('All questions saved to bank')}
function insertBank(idv){const q=state.bank.find(q=>q.id===idv);if(q){const c=JSON.parse(JSON.stringify(q));c.id=id();state.questions.push(c);silent();go('builder');toast('Inserted into quiz')}}
function design(m){m.innerHTML=`<section class="hero"><h1>Design <span>Studio</span></h1><p>Blue-and-gold ESI is the default identity. Creators can change quiz presentation without exposing platform credentials.</p></section><section class="panel"><div class="featurelist"><div class="feature"><b>Theme</b><select class="input" onchange="state.theme=this.value;document.documentElement.classList.toggle('light',this.value==='light');silent()"><option value="dark" ${state.theme==='dark'?'selected':''}>ESI Dark</option><option value="light" ${state.theme==='light'?'selected':''}>ESI Bright</option></select></div><div class="feature"><b>Accent</b><input class="input" type="color" value="${state.accent}" onchange="state.accent=this.value;document.documentElement.style.setProperty('--gold',this.value);silent()"></div><div class="feature"><b>Cover image</b><input class="input" placeholder="Cloud media URL later" oninput="state.cover=this.value;silent()"></div><div class="feature"><b>Font scale</b><input class="input" type="range" min="90" max="125" value="100" oninput="document.body.style.fontSize=this.value+'%'"></div><div class="feature"><b>Accessibility</b><span>Large text, captions, alt text, narration, silent/vibration hooks, color-safe theme and keyboard structure.</span></div><div class="feature"><b>Templates</b><span>Classroom • Exam • Trivia • Certification • Feedback • Game-show • Seasonal • Branded.</span><button class="btn blue" style="margin-top:7px" onclick="openTemplates()">Browse templates</button></div></div></section>`}
function media(m){m.innerHTML=`<section class="hero"><h1>Media <span>Lab</span></h1><p>One place for images, GIFs, audio, video and the complete image-question family. Upload/storage/viewer engines will be connected behind the public UI.</p></section><section class="panel"><div class="featurelist">${Object.entries(types).filter(([k])=>k.includes('image')||['hotspot','multi_hotspot','drag_label','image_occlusion','annotation','panorama','geolocation','comparative','mental_rotation','ar_anchor','silhouette','puzzle','xray','freeze_sequence','art_era','scavenger','spot_edit','rebus','colorization','depth','gif_clue','drawing_race','described','historical_map','progressive','zoom_guess','spot_difference','before_after','diagram'].includes(k)).map(([k,v])=>`<div class="feature"><b>${v}</b><span>Ready in the question schema: ${k}. Specialized rendering engine is a later adapter.</span></div>`).join('')}</div></section>`}
function live(m){m.innerHTML=`<section class="hero"><h1>Live & <span>Async</span></h1><p>Host rooms, homework, practice, teams and adaptive sessions from the same quiz object.</p></section><section class="panel"><div class="featurelist"><div class="feature"><b>Live room</b><span>Join code, QR, host/player views, timers, pause, skip, reveal, kick, extend, teams and leaderboard.</span><button class="btn blue" style="margin-top:7px" onclick="toast('Realtime room engine is staged for the cloud layer')">Create room</button></div><div class="feature"><b>Async assignment</b><span>Due dates, attempts, resume, review mistakes, scheduled release and self-paced mode.</span><button class="btn" style="margin-top:7px" onclick="toast('Assignment engine is staged')">Create assignment</button></div><div class="feature"><b>Adaptive session</b><span>Weak-topic routing, smart shuffle, difficulty rescue, review injection and mastery progression.</span><button class="btn" style="margin-top:7px" onclick="toast('Adaptive engine is staged')">Configure adaptive</button></div><div class="feature"><b>Low-data mode</b><span>Text-first rendering, compressed media, local-first save and offline sync queue.</span><button class="btn" style="margin-top:7px" onclick="toast('Low-data profile enabled for the UI')">Use low-data</button></div></div></section>`}
function analytics(m){m.innerHTML=`<section class="hero"><h1>Analytics <span>Studio</span></h1><p>Creator-facing reporting surface prepared for response data once the scoring and database engines are connected.</p></section><div class="dashgrid"><div class="stat"><b>0%</b><span>Accuracy</span></div><div class="stat"><b>0s</b><span>Avg. time</span></div><div class="stat"><b>0</b><span>Attempts</span></div><div class="stat"><b>—</b><span>Difficulty</span></div></div><section class="panel"><div class="featurelist"><div class="feature"><b>Item analysis</b><span>Difficulty, discrimination, missed-question heatmap and time-per-question.</span></div><div class="feature"><b>Cohort dashboard</b><span>Individual and class views, benchmarks and live progress.</span></div><div class="feature"><b>AI report</b><span>Plain-English summaries, misconception clusters and question-quality flags.</span></div><div class="feature"><b>Exports</b><span>Raw response data, reports, result image, PDF/CSV and future SCORM/xAPI/QTI adapters.</span></div></div></section>`}
function advanced(m){m.innerHTML=`<section class="hero"><h1>Blueprint <span>Command Center</span></h1><p>Every major system from the supplied blueprint is represented here. This screen is deliberately a product/control surface, not a fake claim that external engines are already connected.</p></section><section class="panel"><div class="paneltitle"><div><h2>Core ecosystem</h2><p>${featureGroups.length} major groups</p></div></div><div class="registry">${featureGroups.map(x=>`<div class="reg"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></section><section class="panel"><div class="paneltitle"><div><h2>140 novel features</h2><p>Complete novelty registry from the blueprint</p></div><span class="chip active">${novel.length}/140</span></div><div class="registry">${novel.map((x,i)=>`<div class="reg"><b>#${String(i+1).padStart(3,'0')} ${esc(x)}</b><span>Data/UI contract staged • raw engine later</span></div>`).join('')}</div></section>`}
function preview(){const qs=state.questions.map((q,i)=>`<div class="pvq"><b>${i+1}. ${esc(q.text||'Untitled question')}</b>${(q.options||[]).map(o=>`<span class="pvopt">${esc(o.text||'Option')}</span>`).join('')||'<div style="margin-top:7px;color:#667085;font-size:9px">Response field</div>'}</div>`).join('');openModal(`<div class="modalhead"><h2>Student Preview</h2><button class="close" onclick="closeModal()">×</button></div><div class="preview"><h1>${esc(state.title)}</h1><p style="font-size:9px;color:#667085">${esc(state.description)}</p>${qs||'<p>No questions yet.</p>'}</div><div style="display:flex;gap:6px;margin-top:9px"><button class="btn" onclick="closeModal()">Close</button><button class="btn green" onclick="toast('Submission engine will connect to scoring layer')">Test submission</button></div>`)}
function openModal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function openShare(){openModal(`<div class="modalhead"><h2>Share Quiz</h2><button class="close" onclick="closeModal()">×</button></div><p style="font-size:9px;color:var(--muted)">Publishing will later generate a secure quiz ID, public link, QR code, access rules and embed code. No secret/API key belongs in this public page.</p><div class="featurelist"><div class="feature"><b>Public link</b><span>Shareable URL adapter ready.</span></div><div class="feature"><b>QR code</b><span>Join/publish QR adapter ready.</span></div><div class="feature"><b>Embed</b><span>Iframe/widget adapter ready.</span></div><div class="feature"><b>Access</b><span>Password, invite-only, scheduled and domain restrictions.</span></div></div>`)}
function publish(){if(!state.title.trim())return toast('Give the quiz a title first');save();openModal(`<div class="modalhead"><h2>Ready to publish</h2><button class="close" onclick="closeModal()">×</button></div><p style="font-size:9px;color:var(--muted)">The creator shell is ready. The secure publish engine will later connect this quiz to the database, authentication, storage, scoring and share-link services.</p><div class="feature"><b>Public page rule</b><span>No Firebase config secrets, AI provider keys or admin credentials are shown here.</span></div>`)}
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(state.title||'esi-quiz').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Quiz exported')}
function openTemplates(){openModal(`<div class="modalhead"><h2>Template Gallery</h2><button class="close" onclick="closeModal()">×</button></div><div class="featurelist">${['Classroom Test','JAMB / Exam Practice','Trivia Night','Certification','Feedback Survey','Personality Quiz','Game Show','Icebreaker','Case Study','Image Challenge','Live Tournament','Daily Challenge'].map((x,i)=>`<button class="feature" style="text-align:left" onclick="applyTemplate('${x}')"><b>${x}</b><span>ESI blue/gold layout • preset question/settings structure</span></button>`).join('')}</div>`)}
function applyTemplate(name){state.title=name;state.description='Created from ESI Creator Studio template.';if(!state.questions.length)state.questions=[makeQ('multiple_choice')];silent();closeModal();go('builder');toast(name+' template applied')}
function openInput(k){const v=prompt('Enter the source URL');if(v)toast('Source saved for the secure ingestion adapter')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
load();document.documentElement.classList.toggle('light',state.theme==='light');document.documentElement.style.setProperty('--gold',state.accent||'#f6c800');document.getElementById('themeToggle').classList.toggle('on',state.theme==='light');document.getElementById('compactToggle').classList.toggle('on',!!state.compact);window.page='home';render('home');window.addEventListener('beforeunload',silent);document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}});
</script>
</body>
</html>
