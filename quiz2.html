function go(page){window.page=page;document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick')?.includes("'"+page+"'")));document.querySelectorAll('.bottom button').forEach((b,i)=>b.classList.toggle('active',(page==='home'&&i===0)||(page==='builder'&&i===1)||(page==='ai'&&i===2)||(page==='bank'&&i===3)||(page==='design'&&i===4)||(page==='advanced'&&i===5)));render(page);window.scrollTo({top:0,behavior:'smooth'})}function render(p){const m=document.getElementById('main');if(p==='home')return home(m);if(p==='builder')return builder(m);if(p==='ai')return ai(m);if(p==='bank')return bank(m);if(p==='design')return design(m);if(p==='media')return media(m);if(p==='live')return live(m);if(p==='analytics')return analytics(m);advanced(m)}
function home(m){m.innerHTML=`<section class="hero"><h1>Build your <span>perfect quiz.</span></h1><p>ESI Creator Studio is the phone-first public shell for the complete quiz ecosystem blueprint. Create locally now; secure Worker/Firebase/Supabase engines can be connected later without exposing API keys in this page.</p><div class="actions"><button class="btn gold" onclick="newQuiz()">＋ New Quiz</button><button class="btn blue" onclick="go('builder')">Open Builder</button><button class="btn" onclick="go('ai')">✦ AI Studio</button><button class="btn" onclick="openTemplates()">Template Gallery</button><button class="btn" onclick="openImport()">Import / Export</button></div></section><div class="grid4"><div class="stat"><b>${state.questions.length}</b><span>Questions</span></div><div class="stat"><b>${state.questions.reduce((a,q)=>a+(+q.points||1),0)}</b><span>Total points</span></div><div class="stat"><b>${state.bank.length}</b><span>Bank items</span></div><div class="stat"><b>${featureGroups.length+novel.length}</b><span>Blueprint entries</span></div></div><section class="panel"><div class="title"><div><h2>Start creating</h2><p>Core workflows are one tap away.</p></div></div><div class="cards"><button class="card" onclick="go('builder')"><em>▣</em><strong>Manual Builder</strong><span>Question cards, sections, rich answer data, scoring, settings, ordering, preview and version snapshots.</span></button><button class="card" onclick="go('ai')"><em>✦</em><strong>AI Quiz Studio</strong><span>Topic, text, document, webpage, video, OCR and voice workflows staged for secure server-side AI.</span></button><button class="card" onclick="go('bank')"><em>▤</em><strong>Question Bank</strong><span>Search, folders, tags, favorites, clone, remix and quality metadata.</span></button><button class="card" onclick="go('design')"><em>◈</em><strong>Design Studio</strong><span>ESI blue/gold themes, covers, layouts, accessibility and template presets.</span></button><button class="card" onclick="go('media')"><em>▧</em><strong>Media Lab</strong><span>Images, audio, video, captions, alt text and all visual question interaction contracts.</span></button><button class="card" onclick="go('live')"><em>●</em><strong>Live & Async</strong><span>Room, QR, host, player, teams, spectator, homework and adaptive delivery architecture.</span></button></div></section><section class="panel"><div class="title"><div><h2>Build status</h2><p>Product shell first; raw cloud engines are kept behind adapters.</p></div><span class="chip active">No public API keys</span></div><div class="registry">${[['Local Draft','Ready','Indexed/local storage contract'],['Preview Engine','Ready','Student preview'],['Import/Export','Ready','JSON + adapter registry'],['Firebase Adapter','Staged','Auth/data/storage hooks'],['Worker AI Adapter','Staged','Server-side secret boundary'],['Realtime Engine','Staged','Room synchronization contract']].map(x=>`<div class="reg"><b>${x[0]} • ${x[1]}</b><span>${x[2]}</span></div>`).join('')}</div></section>`}
function newQuiz(){if(state.questions.length&&!confirm('Start a new quiz?'))return;state.title='Untitled Quiz';state.description='Create an engaging quiz with ESI Creator Studio.';state.questions=[];state.sections=[];silent();go('builder');toast('New quiz ready')}
function makeQ(type='multiple_choice'){const fixed=type==='true_false'?['True','False']:type==='yes_no'?['Yes','No']:null;return{id:id(),type,text:'',points:1,required:false,explanation:'',hint:'',tags:[],answer:'',media:'',interaction:'',options:fixed?fixed.map((x,i)=>({text:x,correct:i===0})):['multiple_choice','multiple_select','poll','ordering'].includes(type)?[{text:'',correct:true},{text:'',correct:false},{text:'',correct:false},{text:'',correct:false}]:[],pairs:type==='matching'?[{left:'',right:''},{left:'',right:''}]:[],settings:{tolerance:0,caseSensitive:false,time:0}}}
function addQuestion(type='multiple_choice'){state.questions.push(makeQ(type));silent();builder();setTimeout(()=>document.querySelector('.question:last-of-type textarea')?.focus(),40)}function addSection(){state.sections.push({id:id('s'),title:'New Section',description:''});silent();builder()}function deleteQ(qid){state.questions=state.questions.filter(q=>q.id!==qid);silent();builder()}function duplicateQ(i){const q=JSON.parse(JSON.stringify(state.questions[i]));q.id=id();state.questions.splice(i+1,0,q);silent();builder()}function moveQ(i,d){const n=i+d;if(n<0||n>=state.questions.length)return;[state.questions[i],state.questions[n]]=[state.questions[n],state.questions[i]];silent();builder()}
function updateQ(qid,k,v){const q=state.questions.find(q=>q.id===qid);if(q){q[k]=v;silent()}}function setOption(qid,j,v){const q=state.questions.find(q=>q.id===qid);if(q?.options[j]){q.options[j].text=v;silent()}}function setCorrect(qid,j,m){const q=state.questions.find(q=>q.id===qid);if(!q)return;if(m)q.options[j].correct=!q.options[j].correct;else q.options.forEach((o,k)=>o.correct=k===j);silent()}function addOption(qid){const q=state.questions.find(q=>q.id===qid);if(q){q.options.push({text:'',correct:false});silent();builder()}}function removeOption(qid,j){const q=state.questions.find(q=>q.id===qid);if(q){q.options.splice(j,1);silent();builder()}}function qRequired(qid,v){updateQ(qid,'required',v)}function toggleMore(qid){document.getElementById('more_'+qid)?.classList.toggle('hidden')}
function questionCard(q,i){const meta=types[q.type]||q.type;let body='';if(['multiple_choice','multiple_select','true_false','yes_no','poll','ordering'].includes(q.type)){body=(q.options||[]).map((o,j)=>`<div class="optionrow"><input class="correct" type="${q.type==='multiple_select'?'checkbox':'radio'}" name="c_${q.id}" ${o.correct?'checked':''} onchange="setCorrect('${q.id}',${j},${q.type==='multiple_select'})"><input class="input" value="${esc(o.text)}" placeholder="Option ${j+1}" oninput="setOption('${q.id}',${j},this.value)"><button class="icon" onclick="removeOption('${q.id}',${j})">×</button></div>`).join('')+`<button class="tiny" onclick="addOption('${q.id}')">＋ Add option</button>`}else if(q.type==='matching'){body=(q.pairs||[]).map((p,j)=>`<div class="optionrow"><input class="input" value="${esc(p.left)}" placeholder="Left" oninput="updatePair('${q.id}',${j},'left',this.value)"><input class="input" value="${esc(p.right)}" placeholder="Match" oninput="updatePair('${q.id}',${j},'right',this.value)"></div>`).join('')+`<button class="tiny" onclick="addPair('${q.id}')">＋ Pair</button>`}else if(imageTypes.includes(q.type)){body=`<div class="propertyrow"><label>Media source / URL / asset reference</label><input class="input" value="${esc(q.media)}" placeholder="Attach media through the Media Lab later" oninput="updateQ('${q.id}','media',this.value)"></div><div class="propertyrow"><label>Interaction / coordinates / layers / sequence</label><textarea class="input" placeholder="JSON-friendly interaction data" oninput="updateQ('${q.id}','interaction',this.value)">${esc(q.interaction)}</textarea></div>`}else{body=`<div class="propertyrow"><label>Expected answer / grading rule</label><input class="input" value="${esc(q.answer)}" placeholder="Answer, rubric, formula or rule" oninput="updateQ('${q.id}','answer',this.value)"></div>`}return `<article class="question"><div class="qtop"><div class="qbadge">${i+1}</div><div class="qtype">${esc(meta)}</div><button class="icon" onclick="moveQ(${i},-1)">↑</button><button class="icon" onclick="moveQ(${i},1)">↓</button><button class="icon" onclick="duplicateQ(${i})">⧉</button><button class="icon" onclick="deleteQ('${q.id}')">×</button></div><textarea class="input" placeholder="Type your question..." oninput="updateQ('${q.id}','text',this.value)">${esc(q.text)}</textarea>${body}<div class="qfoot"><label>Required <input type="checkbox" ${q.required?'checked':''} onchange="qRequired('${q.id}',this.checked)"></label><label>Points <input style="width:55px" class="input" type="number" value="${q.points}" onchange="updateQ('${q.id}','points',+this.value||0)"></label><button class="tiny" onclick="cycleType('${q.id}')">Change type</button><button class="tiny" onclick="saveToBank('${q.id}')">Save to bank</button><button class="tiny" onclick="toggleMore('${q.id}')">More</button></div><div id="more_${q.id}" class="hidden" style="margin-top:8px"><textarea class="input" placeholder="Explanation..." oninput="updateQ('${q.id}','explanation',this.value)">${esc(q.explanation)}</textarea><input class="input" style="margin-top:5px" value="${esc(q.hint)}" placeholder="Hint" oninput="updateQ('${q.id}','hint',this.value)"><input class="input" style="margin-top:5px" value="${esc((q.tags||[]).join(', '))}" placeholder="Tags" oninput="updateQ('${q.id}','tags',this.value.split(',').map(x=>x.trim()).filter(Boolean))"></div></article>`}
function builder(m){m.innerHTML=`<div class="panel"><div class="title"><div><h2>Quiz Builder</h2><p>Build → design → preview → publish.</p></div><div class="actions"><button class="btn" onclick="addSection()">＋ Section</button><button class="btn blue" onclick="addQuestion()">＋ Question</button><button class="btn gold" onclick="save()">Save</button></div></div></div><div class="workspace"><aside class="toolbox"><h3>Question types</h3><input class="input toolsearch" placeholder="Find a type..." oninput="filterTools(this.value)"><div id="tools">${Object.entries(types).map(([k,v])=>`<button class="tool" data-name="${esc(v.toLowerCase())}" onclick="addQuestion('${k}')"><b>＋</b>${v}</button>`).join('')}</div></aside><section class="canvas"><div class="canvasbar"><button class="chip active">Questions</button><button class="chip" onclick="go('design')">Design</button><button class="chip" onclick="go('media')">Media</button><button class="chip" onclick="go('bank')">Bank</button><button class="chip" onclick="go('advanced')">Blueprint</button></div><div class="quizcover"><input class="input" value="${esc(state.title)}" oninput="state.title=this.value;silent()"><textarea class="input" placeholder="Quiz description..." oninput="state.description=this.value;silent()">${esc(state.description)}</textarea></div>${state.sections.map((s,i)=>`<div class="section"><b>SECTION ${i+1}</b><input class="input" value="${esc(s.title)}" oninput="state.sections[${i}].title=this.value;silent()"><input class="input" value="${esc(s.description||'')}" placeholder="Section instructions" oninput="state.sections[${i}].description=this.value;silent()"></div>`).join('')}${state.questions.length?state.questions.map(questionCard).join(''):`<div class="panel" style="text-align:center;padding:42px"><h2 style="margin:0 0 5px">Your canvas is ready</h2><p style="color:var(--muted);font-size:9px">Add a question to start. Every draft is saved locally.</p><button class="btn blue" onclick="addQuestion()">＋ Add first question</button></div>`}</section><aside class="properties"><h3>Quiz settings</h3><div class="propertyrow"><label>Mode</label><select class="input" onchange="state.mode=this.value;silent()">${['classic','async','live','adaptive','practice','poll','exam'].map(x=>`<option ${state.mode===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="propertyrow"><label>Time limit (minutes)</label><input class="input" type="number" value="${state.settings.time}" oninput="state.settings.time=+this.value||0;silent()"></div><div class="propertyrow"><label>Passing score %</label><input class="input" type="number" value="${state.settings.pass}" oninput="state.settings.pass=+this.value||0;silent()"></div>${[['showScore','Show score'],['showAnswers','Show correct answers'],['showExplain','Show explanations'],['randomQ','Randomize questions'],['randomA','Randomize answers'],['back','Allow back navigation'],['anonymous','Allow anonymous responses'],['leaderboard','Leaderboard hook']].map(x=>`<label class="check"><input type="checkbox" ${state.settings[x[0]]?'checked':''} onchange="state.settings.${x[0]}=this.checked;silent()">${x[1]}</label>`).join('')}<button class="btn green" style="width:100%;margin-top:8px" onclick="preview()">▶ Student Preview</button><button class="btn" style="width:100%;margin-top:5px" onclick="openImport()">⇩ Import / Export</button></aside></div>`}
function filterTools(v){document.querySelectorAll('#tools .tool').forEach(x=>x.style.display=x.dataset.name.includes(v.toLowerCase())?'block':'none')}function updatePair(qid,j,k,v){const q=state.questions.find(q=>q.id===qid);if(q?.pairs[j]){q.pairs[j][k]=v;silent()}}function addPair(qid){const q=state.questions.find(q=>q.id===qid);if(q){q.pairs.push({left:'',right:''});silent();builder()}}function cycleType(qid){const q=state.questions.find(q=>q.id===qid);if(!q)return;const ks=Object.keys(types);q.type=ks[(ks.indexOf(q.type)+1)%ks.length];q.options=q.type==='true_false'?['True','False'].map((x,i)=>({text:x,correct:i===0})):q.type==='yes_no'?['Yes','No'].map((x,i)=>({text:x,correct:i===0})):['multiple_choice','multiple_select','poll','ordering'].includes(q.type)?[{text:'',correct:true},{text:'',correct:false},{text:'',correct:false},{text:'',correct:false}]:[];q.pairs=q.type==='matching'?[{left:'',right:''},{left:'',right:''}]:[];silent();builder()}
function ai(m){m.innerHTML=`<section class="hero"><h1>✦ AI <span>Studio</span></h1><p>Generation inputs live here; provider credentials never do. When connected, Cloudflare Workers/Pages Functions or another secure server boundary should hold Gemini/Groq/Workers AI secrets.</p></section><section class="panel"><div class="title"><div><h2>Generation workflows</h2><p>Choose the source and prepare a structured draft.</p></div></div><div class="cards">${[['Topic','topic','Enter a subject, level, number of questions and difficulty.'],['Text','text','Paste lesson notes, syllabus material or revision content.'],['Document','file','PDF/DOCX/PPTX upload adapter; file processing belongs behind secure storage/worker.'],['Web / Video','web','URL input adapter for webpage or YouTube source processing.'],['Photo OCR','ocr','Textbook-photo OCR workflow for turning visible content into questions.'],['Voice','voice','Speech-to-quiz adapter using browser speech or server transcription.']].map(x=>`<button class="card" onclick="aiWizard('${x[1]}')"><em>✦</em><strong>${x[0]}</strong><span>${x[2]}</span></button>`).join('')}</div></section><section class="panel"><div class="title"><div><h2>AI controls</h2><p>Prepared for the blueprint's generation pipeline.</p></div></div><div class="registry">${['Difficulty calibration','Bloom taxonomy','Distractor generator','Explanation generator','Simplify wording','Translate','Duplicate detector','Originality check','Proofreading','Answer-key sanity check','AI copilot','Misconception detector','Adaptive follow-up','Socratic mode','Auto cheat sheet','Weekly recap'].map(x=>`<div class="reg"><b>${x}</b><span>Adapter-ready control; no credential is collected here.</span></div>`).join('')}</div></section>`}
function aiWizard(kind){modal(`<div class="modalhead"><h2>AI ${esc(kind)} workflow</h2><button class="close" onclick="closeModal()">×</button></div><p style="font-size:8px;color:var(--muted)">This page does not request API keys. Enter safe source information and create a local draft; the secure engine can be connected later.</p><input id="aiSource" class="input" placeholder="${kind==='topic'?'Topic or subject...':kind==='web'?'Webpage / video URL...':'Source text or description...'}"><div class="grid4" style="grid-template-columns:repeat(2,1fr)"><input id="aiCount" class="input" type="number" value="10" min="1" placeholder="Questions"><select id="aiLevel" class="input"><option>Beginner</option><option>Intermediate</option><option>Advanced</option><option>Exam</option></select><select id="aiDifficulty" class="input"><option>Mixed</option><option>Easy</option><option>Medium</option><option>Hard</option><option>Adaptive</option></select><select id="aiType" class="input"><option value="multiple_choice">Multiple choice</option><option value="multiple_select">Multiple select</option><option value="true_false">True / false</option><option value="short_text">Short answer</option></select></div><button class="btn blue" onclick="createAIDraft()">Create local draft</button>`)}
function createAIDraft(){const s=document.getElementById('aiSource')?.value.trim()||'Generated topic';const n=Math.min(50,Math.max(1,+document.getElementById('aiCount')?.value||10));const t=document.getElementById('aiType')?.value||'multiple_choice';for(let i=0;i<n;i++){const q=makeQ(t);q.text=`${s} — draft question ${i+1}`;q.tags=['ai-draft'];state.questions.push(q)}state.title=s+' Quiz';silent();closeModal();go('builder');toast(n+' local draft questions created')}
function bank(m){m.innerHTML=`<section class="hero"><h1>Question <span>Bank</span></h1><p>Reusable content, folders, tags, favorites, remixing and future public-library sharing.</p><div class="actions"><button class="btn blue" onclick="saveAllToBank()">Save quiz questions</button><button class="btn" onclick="bankSearch()">Search bank</button><button class="btn" onclick="toast('Marketplace adapter staged')">Marketplace</button></div></section><section class="panel"><div class="title"><div><h2>Local bank</h2><p>${state.bank.length} reusable items.</p></div></div>${state.bank.length?`<div class="registry">${state.bank.map((q,i)=>`<div class="reg"><b>${i+1}. ${esc(q.text||'Untitled')}</b><span>${esc(types[q.type]||q.type)} • ${esc((q.tags||[]).join(', '))}</span><button class="tiny" style="margin-top:6px" onclick="useBank(${i})">Add to quiz</button></div>`).join('')}</div>`:`<p style="font-size:9px;color:var(--muted)">Your bank is empty. Use “Save to bank” on a question.</p>`}</section><section class="panel"><div class="title"><div><h2>Bank capabilities</h2><p>Blueprint-ready organization layer.</p></div></div><div class="registry">${['Folders','Tags','Favorites','Search','Duplicate detection','Remix','Clone','Fork','Public library','Ratings','Standards tags','Question quality score','Version lineage','Quiz DNA ancestry','Peer-reviewed authoring'].map(x=>`<div class="reg"><b>${x}</b><span>Ready as local metadata or future cloud-backed capability.</span></div>`).join('')}</div></section>`}
function saveToBank(qid){const q=state.questions.find(q=>q.id===qid);if(q){state.bank.push(JSON.parse(JSON.stringify(q)));silent();toast('Question saved to bank')}}function saveAllToBank(){state.questions.forEach(q=>state.bank.push(JSON.parse(JSON.stringify(q))));silent();toast('All questions copied to bank');bank(document.getElementById('main'))}function useBank(i){state.questions.push(JSON.parse(JSON.stringify(state.bank[i])));state.questions.at(-1).id=id();silent();go('builder')}function bankSearch(){modal(`<div class="modalhead"><h2>Search question bank</h2><button class="close" onclick="closeModal()">×</button></div><input class="input" autofocus placeholder="Search text or tag..." oninput="renderBankSearch(this.value)"><div id="bankResults" style="margin-top:8px"></div>`);renderBankSearch('')}function renderBankSearch(v){const el=document.getElementById('bankResults');if(!el)return;const a=state.bank.filter(q=>(q.text+' '+(q.tags||[]).join(' ')).toLowerCase().includes(v.toLowerCase()));el.innerHTML=a.map(q=>`<div class="reg" style="margin:5px 0"><b>${esc(q.text||'Untitled')}</b><span>${esc(types[q.type]||q.type)}</span></div>`).join('')||'<p style="font-size:8px;color:var(--muted)">No matches.</p>'}
function design(m){m.innerHTML=`<section class="hero"><h1>Design <span>Studio</span></h1><p>Build the visual identity and delivery experience without touching the quiz engine.</p></section><section class="panel"><div class="title"><div><h2>ESI theme</h2><p>Blue, gold and readable student-first presentation.</p></div></div><div class="actions"><button class="btn blue" onclick="state.accent='#1684e8';silent();toast('Blue accent selected')">ESI Blue</button><button class="btn gold" onclick="state.accent='#f6c800';silent();toast('Gold accent selected')">ESI Gold</button><button class="btn" onclick="toggleTheme()">Bright / Dark</button><button class="btn" onclick="applyTemplate(9)">ESI Branded</button></div></section><section class="panel"><div class="title"><div><h2>Accessibility & delivery</h2><p>Settings represented from the blueprint.</p></div></div><div class="registry">${['Font scaling','High contrast','Color-safe themes','Screen-reader labels','Alt text','Captions','Narration','Vibration feedback','Extended time','RTL layout','Multilingual UI','Reduced motion','Keyboard navigation','Silent accessibility mode'].map(x=>`<div class="reg"><b>${x}</b><span>Toggle/adapter contract prepared for the final engine.</span></div>`).join('')}</div></section>`}
function media(m){m.innerHTML=`<section class="hero"><h1>Media <span>Lab</span></h1><p>Prepare image, audio, video and interaction metadata. Actual cloud upload can be connected through R2/Firebase/Supabase later.</p><div class="actions"><button class="btn blue" onclick="toast('Media picker adapter staged')">＋ Add media</button><button class="btn" onclick="toast('Compression pipeline staged')">Compress</button><button class="btn" onclick="toast('Alt-text assistant staged')">Generate alt text</button></div></section><section class="panel"><div class="title"><div><h2>Visual question system</h2><p>${imageTypes.length} visual modes are registered.</p></div></div><div class="registry">${imageTypes.map((k,i)=>`<div class="reg"><b>${i+1}. ${esc(types[k])}</b><span>Media + interaction contract • coordinate/layer/sequence ready.</span></div>`).join('')}</div></section><section class="panel"><div class="title"><div><h2>Media pipeline</h2><p>Low-data and accessibility support.</p></div></div><div class="registry">${['Lazy loading','Thumbnail generation','Image compression','Audio compression','Video poster frames','Captions/subtitles','Alt text','OCR','R2 storage adapter','Firebase Storage adapter','Supabase Storage adapter','Offline media queue'].map(x=>`<div class="reg"><b>${x}</b><span>Ready as a client-side contract; cloud operations remain adapter-backed.</span></div>`).join('')}</div></section>`}
function live(m){m.innerHTML=`<section class="hero"><h1>Live <span>& Async</span></h1><p>Host real-time games, scheduled tests, practice sessions and homework from the same quiz definition.</p><div class="actions"><button class="btn blue" onclick="createRoom()">Create room</button><button class="btn" onclick="toast('QR join surface staged')">QR join</button><button class="btn" onclick="toast('Host controls staged')">Host controls</button></div></section><section class="panel"><div class="title"><div><h2>Delivery modes</h2><p>Choose the experience the backend will later synchronize.</p></div></div><div class="cards">${['Live host','Async homework','Exam','Practice','Adaptive','Poll','Team battle','Spectator','Observer','Cohost'].map(x=>`<button class="card" onclick="toast('${x} mode selected')"><em>●</em><strong>${x}</strong><span>Room state, access rules, timers, progress and recovery hooks.</span></button>`).join('')}</div></section><section class="panel"><div class="title"><div><h2>Low-data and recovery</h2><p>Important for unreliable mobile networks.</p></div></div><div class="registry">${['IndexedDB draft','Sync queue','Reconnect recovery','Text-first channel','Compressed media','Resume session','Scheduled release','Alternate channel adapter','Local-first save','Offline sync queue'].map(x=>`<div class="reg"><b>${x}</b><span>Prepared for local-first or realtime implementation.</span></div>`).join('')}</div></section>`}
function createRoom(){const code=Math.random().toString(36).slice(2,8).toUpperCase();modal(`<div class="modalhead"><h2>Live room prepared</h2><button class="close" onclick="closeModal()">×</button></div><div style="font-size:30px;font-weight:900;color:var(--gold);letter-spacing:5px;text-align:center;padding:20px">${code}</div><p style="font-size:8px;color:var(--muted);text-align:center">This is a local room-code surface. Realtime participant synchronization requires the secure cloud adapter.</p><button class="btn blue" onclick="closeModal()">Continue</button>`)}
function analytics(m){const total=state.questions.reduce((a,q)=>a+(+q.points||1),0);m.innerHTML=`<section class="hero"><h1>Analytics <span>Center</span></h1><p>Reporting surfaces for item quality, cohort progress, time, scoring and future AI summaries.</p></section><div class="grid4"><div class="stat"><b>${state.questions.length}</b><span>Items</span></div><div class="stat"><b>${total}</b><span>Points</span></div><div class="stat"><b>${state.questions.filter(q=>q.required).length}</b><span>Required</span></div><div class="stat"><b>${state.versions?.length||0}</b><span>Snapshots</span></div></div><section class="panel"><div class="title"><div><h2>Analysis modules</h2><p>Each module is an adapter-ready reporting contract.</p></div></div><div class="registry">${['Item difficulty','Item discrimination','Cohort dashboard','Heatmaps','Time per question','Benchmarking','Raw responses','Live progress','Score distribution','Question quality','AI summary','Misconception clusters','Mastery progression','Readiness prediction','Confidence calibration','Quiz autopsy','Beat your past self','Personal-best ghost race'].map(x=>`<div class="reg"><b>${x}</b><span>Data surface ready for real response data.</span></div>`).join('')}</div></section>`}
function advanced(m){m.innerHTML=`<section class="hero"><h1>Blueprint <span>Explorer</span></h1><p>The complete ecosystem registry is visible here so the product can be expanded without losing feature coverage. “Staged” means the UI/data contract exists; it does not claim a backend engine is live.</p><div class="actions"><button class="btn blue" onclick="openArchitecture()">Architecture</button><button class="btn" onclick="openImport()">Import / Export</button><button class="btn" onclick="openTemplates()">Templates</button></div></section><section class="panel"><div class="title"><div><h2>Core ecosystem</h2><p>${featureGroups.length} major blueprint groups.</p></div></div><div class="registry">${featureGroups.map((x,i)=>`<div class="reg"><b>${i+1}. ${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div></section><section class="panel"><div class="title"><div><h2>140 novel features</h2><p>All named novel concepts are retained as individual registry entries.</p></div><input id="novelSearch" class="input" style="max-width:220px" placeholder="Search novel features..." oninput="filterNovel(this.value)"></div><div id="novelGrid" class="registry">${novel.map((x,i)=>`<div class="reg" data-novel="${esc(x.toLowerCase())}"><b>${String(i+1).padStart(3,'0')} • ${esc(x)}</b><span>Blueprint concept • implementation hook reserved.</span></div>`).join('')}</div></section>`}function filterNovel(v){document.querySelectorAll('[data-novel]').forEach(x=>x.style.display=x.dataset.novel.includes(v.toLowerCase())?'block':'none')}
function openArchitecture(){modal(`<div class="modalhead"><h2>Secure architecture</h2><button class="close" onclick="closeModal()">×</button></div><div class="registry">${[['Public page','quiz2.html • no secrets'],['Identity','Firebase Auth / Supabase Auth adapter'],['Realtime','Firebase Realtime Database / Supabase Realtime'],['Files','Firebase Storage / Cloudflare R2 / Supabase Storage'],['AI','Cloudflare Workers AI / Gemini / Groq through secure Worker'],['Server logic','Cloudflare Worker / Pages Function'],['Analytics','Client events + secure server aggregation'],['Offline','IndexedDB + local queue + reconnect merge'],['Payments','Paystack / Flutterwave adapter later'],['Notifications','Email/push provider adapter later']].map(x=>`<div class="reg"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div><p style="font-size:8px;color:var(--muted);margin-top:10px">No API-key input is exposed in this public HTML. Secrets belong server-side.</p>`)}
function openTemplates(){modal(`<div class="modalhead"><h2>Template Gallery</h2><button class="close" onclick="closeModal()">×</button></div><div class="registry">${templates.map((x,i)=>`<button class="reg" style="text-align:left" onclick="applyTemplate(${i})"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></button>`).join('')}</div>`)}function applyTemplate(i){const t=templates[i]||templates[0];state.title=t[0]+' Quiz';state.description=t[1];silent();closeModal();go('builder');toast(t[0]+' template applied')}function openImport(){modal(`<div class="modalhead"><h2>Import / Export Center</h2><button class="close" onclick="closeModal()">×</button></div><p style="font-size:8px;color:var(--muted)">The public shell uses JSON locally. Format-specific adapters are registered for the blueprint without pretending they are already connected.</p><div class="registry">${['JSON','CSV','Excel','Word','PDF','PPTX','Google Forms','Kahoot XLSX','GIFT','Moodle XML','QTI','Anki','SCORM','xAPI','Share link','Embed / iframe','Results image'].map(x=>`<button class="reg" style="text-align:left" onclick="formatAction('${x}')"><b>${x}</b><span>Adapter surface</span></button>`).join('')}</div><div class="actions" style="margin-top:10px"><button class="btn blue" onclick="exportJSON()">Export current JSON</button><button class="btn" onclick="importJSON()">Paste JSON</button></div>`)}function formatAction(x){toast(x+' adapter staged')}function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(state.title||'quiz').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.json';a.click();URL.revokeObjectURL(a.href);toast('JSON exported')}function importJSON(){const raw=prompt('Paste a previously exported ESI quiz JSON');if(!raw)return;try{const x=JSON.parse(raw);state=Object.assign(state,x);state.settings=Object.assign(state.settings,x.settings||{});silent();closeModal();go('builder');toast('Quiz imported')}catch(e){toast('Invalid JSON')}}
function preview(){const qs=state.questions.map((q,i)=>`<div class="pvq"><b>${i+1}. ${esc(q.text||'Untitled question')}</b>${(q.options||[]).map(o=>`<span class="pvopt">${esc(o.text||'Option')}</span>`).join('')}</div>`).join('');modal(`<div class="modalhead"><h2>Student Preview</h2><button class="close" onclick="closeModal()">×</button></div><div class="preview"><h1>${esc(state.title)}</h1><p style="font-size:9px">${esc(state.description)}</p>${qs||'<p>No questions yet.</p>'}<button class="btn blue" style="margin-top:12px" onclick="toast('Preview submission surface ready')">Submit</button></div>`)}function openShare(){modal(`<div class="modalhead"><h2>Share & Publish</h2><button class="close" onclick="closeModal()">×</button></div><p style="font-size:9px;color:var(--muted)">Publishing is prepared as a secure distribution workflow. A real public URL requires the cloud publish adapter.</p><div class="registry">${['Share link','QR code','Access code','Password','Invite-only','Scheduled release','Embed / iframe','WhatsApp share','Email share','SMS share','Observer link','Challenge-a-friend'].map(x=>`<div class="reg"><b>${x}</b><span>Distribution hook staged.</span></div>`).join('')}</div>`)}function publish(){save();openShare();toast('Draft prepared for secure publishing')}function closeModal(){document.getElementById('modal').classList.remove('open')}function modal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.add('open')}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
load();applyTheme();go('home');
</script>
</body>
</html>
