function silent(){state.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Draft storage is unavailable on this device')}}function snapshot(){state.history=state.history||[];state.history.unshift({at:Date.now(),title:state.title,questions:state.questions.length});state.history=state.history.slice(0,30)}function save(){snapshot();silent();toast('Saved on this device')}function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x){state=Object.assign(state,x);state.settings=Object.assign(state.settings,x.settings||{});state.nexus=Object.assign(state.nexus,x.nexus||{})}}catch(e){}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2300)}function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';applyTheme();silent()}function applyTheme(){document.documentElement.classList.toggle('light',state.theme==='light');document.getElementById('themeToggle')?.classList.toggle('on',state.theme==='light')}function toggleCompact(){state.compact=!state.compact;document.getElementById('compactToggle')?.classList.toggle('on',state.compact);document.body.style.fontSize=state.compact?'95%':'';silent()}

function newQuiz(){if(state.questions.length&&!confirm('Start a new quiz?'))return;state.title='Untitled Quiz';state.description='Create an engaging ESI quiz.';state.questions=[];state.sections=[];state.media=[];silent();go('builder');toast('New quiz ready')}
function makeQ(type='multiple_choice'){const fixed=type==='true_false'?['True','False']:type==='yes_no'?['Yes','No']:null;return{id:id(),type,text:'',points:1,required:false,explanation:'',hint:'',tags:[],answer:'',media:'',interaction:'',options:fixed?fixed.map((x,i)=>({text:x,correct:i===0})):['multiple_choice','multiple_select','poll','ordering'].includes(type)?[{text:'',correct:true},{text:'',correct:false},{text:'',correct:false},{text:'',correct:false}]:[],pairs:type==='matching'?[{left:'',right:''},{left:'',right:''}]:[]}}
function addQuestion(type='multiple_choice'){state.questions.push(makeQ(type));silent();builder();setTimeout(()=>document.querySelector('.question:last-of-type textarea')?.focus(),40)}function addSection(){state.sections.push({id:id('s'),title:'New Section',description:''});silent();builder()}function deleteQ(i){state.questions.splice(i,1);silent();builder()}function duplicateQ(i){const q=JSON.parse(JSON.stringify(state.questions[i]));q.id=id();state.questions.splice(i+1,0,q);silent();builder()}function moveQ(i,d){const n=i+d;if(n<0||n>=state.questions.length)return;[state.questions[i],state.questions[n]]=[state.questions[n],state.questions[i]];silent();builder()}function updateQ(idv,k,v){const q=state.questions.find(q=>q.id===idv);if(q){q[k]=v;silent()}}function setOption(idv,j,v){const q=state.questions.find(q=>q.id===idv);if(q?.options[j]){q.options[j].text=v;silent()}}function setCorrect(idv,j,m){const q=state.questions.find(q=>q.id===idv);if(!q)return;if(m)q.options[j].correct=!q.options[j].correct;else q.options.forEach((o,k)=>o.correct=k===j);silent()}function addOption(idv){const q=state.questions.find(q=>q.id===idv);if(q){q.options.push({text:'',correct:false});silent();builder()}}function removeOption(idv,j){const q=state.questions.find(q=>q.id===idv);if(q){q.options.splice(j,1);silent();builder()}}function addPair(idv){const q=state.questions.find(q=>q.id===idv);if(q){q.pairs.push({left:'',right:''});silent();builder()}}function setPair(idv,j,k,v){const q=state.questions.find(q=>q.id===idv);if(q?.pairs[j]){q.pairs[j][k]=v;silent()}}function changeType(idv){const q=state.questions.find(q=>q.id===idv);if(!q)return;const ks=Object.keys(types),n=(ks.indexOf(q.type)+1)%ks.length;q.type=ks[n];q.options=[];q.pairs=[];if(['multiple_choice','multiple_select','poll','ordering'].includes(q.type))q.options=[{text:'',correct:true},{text:'',correct:false}];silent();builder();toast('Type: '+types[q.type])}function filterTools(v){document.querySelectorAll('#tools .tool').forEach(x=>x.style.display=x.dataset.name.includes(v.toLowerCase())?'block':'none')}
function questionBody(q){if(['multiple_choice','multiple_select','true_false','yes_no','poll','ordering'].includes(q.type))return(q.options||[]).map((o,j)=>`<div class="optionrow"><input class="correct" type="${q.type==='multiple_select'?'checkbox':'radio'}" name="c_${q.id}" ${o.correct?'checked':''} onchange="setCorrect('${q.id}',${j},${q.type==='multiple_select'})"><input class="input" value="${esc(o.text)}" placeholder="Option ${j+1}" oninput="setOption('${q.id}',${j},this.value)"><button class="icon" onclick="removeOption('${q.id}',${j})">×</button></div>`).join('')+`<button class="tiny" onclick="addOption('${q.id}')">＋ Add option</button>`;if(q.type==='matching')return(q.pairs||[]).map((p,j)=>`<div class="optionrow"><input class="input" value="${esc(p.left)}" placeholder="Left" oninput="setPair('${q.id}',${j},'left',this.value)"><input class="input" value="${esc(p.right)}" placeholder="Match" oninput="setPair('${q.id}',${j},'right',this.value)"></div>`).join('')+`<button class="tiny" onclick="addPair('${q.id}')">＋ Pair</button>`;if(image45.includes(q.type)||q.type.startsWith('image'))return`<div class="propertyrow"><label>Media asset</label><input class="input" value="${esc(q.media)}" placeholder="Asset name or storage reference" oninput="updateQ('${q.id}','media',this.value)"></div><div class="propertyrow"><label>Interaction data</label><textarea class="input" placeholder="Targets, coordinates, layers, sequence or grading data" oninput="updateQ('${q.id}','interaction',this.value)">${esc(q.interaction)}</textarea></div>`;return`<div class="propertyrow"><label>Expected answer / grading rule</label><input class="input" value="${esc(q.answer)}" placeholder="Answer, rubric, formula or tolerance" oninput="updateQ('${q.id}','answer',this.value)"></div>`}
function questionCard(q,i){return`<article class="question"><div class="qtop"><div class="qbadge">${i+1}</div><div class="qtype">${esc(types[q.type]||q.type)}</div><button class="icon" onclick="moveQ(${i},-1)">↑</button><button class="icon" onclick="moveQ(${i},1)">↓</button><button class="icon" onclick="duplicateQ(${i})">⧉</button><button class="icon" onclick="deleteQ(${i})">×</button></div><textarea class="input" placeholder="Type your question..." oninput="updateQ('${q.id}','text',this.value)">${esc(q.text)}</textarea>${questionBody(q)}<div class="qfoot"><label>Required <input type="checkbox" ${q.required?'checked':''} onchange="updateQ('${q.id}','required',this.checked)"></label><label>Points <input style="width:55px" class="input" type="number" value="${q.points}" onchange="updateQ('${q.id}','points',+this.value||0)"></label><button class="tiny" onclick="changeType('${q.id}')">Change type</button><button class="tiny" onclick="saveToBank('${q.id}')">Save to bank</button><button class="tiny" onclick="toggleMore('${q.id}')">More</button></div><div id="more_${q.id}" class="hidden" style="margin-top:8px"><textarea class="input" placeholder="Explanation" oninput="updateQ('${q.id}','explanation',this.value)">${esc(q.explanation)}</textarea><input class="input" style="margin-top:5px" value="${esc(q.hint)}" placeholder="Hint" oninput="updateQ('${q.id}','hint',this.value)"><input class="input" style="margin-top:5px" value="${esc((q.tags||[]).join(', '))}" placeholder="Tags" oninput="updateQ('${q.id}','tags',this.value.split(',').map(x=>x.trim()).filter(Boolean))"></div></article>`}function toggleMore(idv){document.getElementById('more_'+idv)?.classList.toggle('hidden')}
function builder(m){m.innerHTML=`<div class="panel"><div class="title"><div><h2>Quiz Builder</h2><p>Create → refine → validate → preview.</p></div><div class="actions"><button class="btn" onclick="addSection()">＋ Section</button><button class="btn blue" onclick="addQuestion()">＋ Question</button><button class="btn gold" onclick="save()">Save</button></div></div></div><div class="workspace"><aside class="toolbox"><h3>Question types</h3><div class="toolsearch"><input class="input" placeholder="Find a type..." oninput="filterTools(this.value)"></div><div id="tools">${Object.entries(types).map(([k,v])=>`<button class="tool" data-name="${esc(v.toLowerCase())}" onclick="addQuestion('${k}')"><b>＋</b>${esc(v)}</button>`).join('')}</div></aside><section class="canvas"><div class="canvasbar"><button class="chip active">Questions</button><button class="chip" onclick="go('design')">Design</button><button class="chip" onclick="go('media')">Media</button><button class="chip" onclick="go('bank')">Bank</button><button class="chip" onclick="openValidation()">Validate</button><button class="chip" onclick="go('analytics')">Nexus</button></div><div class="quizcover"><input class="input" value="${esc(state.title)}" oninput="state.title=this.value;silent()"><textarea class="input" placeholder="Quiz description..." oninput="state.description=this.value;silent()">${esc(state.description)}</textarea></div>${state.sections.map((s,i)=>`<div class="section"><b>SECTION ${i+1}</b><input class="input" value="${esc(s.title)}" oninput="state.sections[${i}].title=this.value;silent()"><input class="input" value="${esc(s.description||'')}" placeholder="Section instructions" oninput="state.sections[${i}].description=this.value;silent()"></div>`).join('')}${state.questions.length?state.questions.map(questionCard).join(''):`<div class="panel" style="text-align:center;padding:42px"><h2 style="margin:0 0 5px">Your canvas is ready</h2><p style="color:var(--muted);font-size:9px">Choose a question type or add function labelSetting(k){return({showScore:'Show score',showAnswers:'Show correct answers',showExplain:'Show explanations',randomQ:'Randomize questions',randomA:'Randomize answers',back:'Allow back navigation',anonymous:'Allow anonymous responses',leaderboard:'Leaderboard'})[k]}
function ai(m){m.innerHTML=`<section class="hero"><h1>✦ AI <span>Studio</span></h1><p>Choose a generation path, set the learning intent and review the result before it enters your quiz.</p></section><section class="panel"><div class="title"><div><h2>Generation paths</h2><p>Designed for safe, review-first creation.</p></div></div><div class="cards"><button class="card" onclick="aiDemo('topic')"><em>✦</em><strong>Topic → Quiz</strong><span>Topic, subject, count, difficulty, Bloom level and language.</span></button><button class="card" onclick="aiDemo('text')"><em>▤</em><strong>Text → Quiz</strong><span>Turn lesson notes into a structured question draft.</span></button><button class="card" onclick="aiDemo('document')"><em>PDF</em><strong>Document → Quiz</strong><span>Prepare PDF, DOCX or PPTX material for generation.</span></button><button class="card" onclick="aiDemo('web')"><em>◎</em><strong>Web / video</strong><span>Prepare a webpage or video source workflow.</span></button><button class="card" onclick="aiDemo('photo')"><em>▧</em><strong>Textbook photo</strong><span>OCR-first workflow for photographed learning material.</span></button><button class="card" onclick="aiDemo('voice')"><em>◉</em><strong>Voice → Quiz</strong><span>Transcription-first workflow for spoken lessons.</span></button></div></section><section class="panel"><div class="stepper"><div class="step on">1 · Source</div><div class="step on">2 · Intent</div><div class="step">3 · Generate</div><div class="step">4 · Review</div><div class="step">5 · Insert</div></div><div class="propertyrow"><label>What should the quiz cover?</label><textarea id="aiPrompt" class="input" style="min-height:110px" placeholder="Example: Create a Biology revision quiz about cell division..."></textarea></div><div class="grid4"><div class="propertyrow"><label>Questions</label><input id="aiCount" class="input" type="number" value="10" min="1" max="100"></div><div class="propertyrow"><label>Difficulty</label><select id="aiDiff" class="input"><option>mixed</option><option>easy</option><option>medium</option><option>hard</option></select></div><div class="propertyrow"><label>Bloom</label><select id="aiBloom" class="input"><option>mixed</option><option>remember</option><option>understand</option><option>apply</option><option>analyze</option><option>evaluate</option><option>create</option></select></div><div class="propertyrow"><label>Language</label><input id="aiLang" class="input" value="English"></div></div><button class="btn gold" onclick="generateDraft()">✦ Prepare generation</button><div id="aiStatus" style="margin-top:8px;color:var(--muted);font-size:8px"></div></section><section class="panel"><div class="title"><div><h2>Generation engines</h2><p>Engine connections can be wired later without exposing credentials in the user interface.</p></div></div><div class="engine"><div class="reg"><b>Browser</b><span class="state">✓ Ready</span></div><div class="reg"><b>Secure Worker</b><span>Connection point</span></div><div class="reg"><b>AI provider</b><span>Server-side adapter</span></div><div class="reg"><b>Validator</b><span class="state">✓ Review gate</span></div></div></section>`}
function aiDemo(k){const s=document.getElementById('aiPrompt');if(s)s.value={topic:'Create a balanced revision quiz from this topic: ',text:'Turn the following lesson text into a quiz: ',document:'Generate questions from the uploaded document.',web:'Generate questions from this webpage or video source.',photo:'Read the textbook photo and create questions.',voice:'Turn this spoken lesson into quiz questions.'}[k];toast('AI workflow selected')}function generateDraft(){const p=document.getElementById('aiPrompt')?.value.trim();if(!p){toast('Add a topic or source first');return}const count=Math.max(1,Math.min(100,+document.getElementById('aiCount').value||10));document.getElementById('aiStatus').textContent=`Generation plan ready: ${count} question(s), ${document.getElementById('aiDiff').value} difficulty, ${document.getElementById('aiBloom').value} Bloom level.`;toast('Generation plan prepared')}
function bank(m){m.innerHTML=`<section class="hero"><h1>Question <span>Bank</span></h1><p>Build a library of questions you can reuse, refine and remix.</p></section><section class="panel"><div class="title"><div><h2>Library</h2><p>${state.bank.length} saved item(s)</p></div><div class="actions"><button class="btn blue" onclick="saveAllBank()">Save current quiz</button><button class="btn" onclick="exportBank()">Export bank</button></div></div><input id="bankSearch" class="input" placeholder="Search question, type or tag..." oninput="renderBankList(this.value)"><div id="bankList" style="margin-top:9px"></div></section><section class="panel"><div class="title"><div><h2>Library intelligence</h2><p>Keep the bank clean and useful.</p></div></div><div class="registry">${['Folders & collections','Tags & taxonomy','Favorites','Difficulty labels','Quality score','Duplicate detector','Fork / remix','Creator packs','Marketplace metadata'].map(x=>`<div class="reg"><b>${x}</b><span>Ready as a reusable data contract.</span></div>`).join('')}</div></section>`;renderBankList('')}function renderBankList(term){const r=document.getElementById('bankList');if(!r)return;term=term.toLowerCase();const a=state.bank.filter(q=>JSON.stringify(q).toLowerCase().includes(term));r.innerHTML=a.length?a.map(q=>`<div class="tile" style="padding:10px;margin-bottom:6px;border-radius:10px"><b style="font-size:9px">${esc(q.text||'Untitled')}</b><div style="color:var(--muted);font-size:7px">${esc(types[q.type]||q.type)} • ${q.points||1} point(s)</div><button class="tiny" style="margin-top:5px" onclick="insertBank('${q.id}')">＋ Insert</button></div>`).join(''):'<div class="tile" style="padding:12px;border-radius:10px"><b style="font-size:9px">No matching bank items</b><div style="color:var(--muted);font-size:7px">Save a question to start your library.</div></div>'}function saveToBank(idv){const q=state.questions.find(q=>q.id===idv);if(q){const c=JSON.parse(JSON.stringify(q));c.id=id('bank');state.bank.unshift(c);silent();toast('Saved to bank')}}function saveAllBank(){state.questions.forEach(q=>{const c=JSON.parse(JSON.stringify(q));c.id=id('bank');state.bank.unshift(c)});silent();go('bank');toast('Questions saved to bank')}function insertBank(idv){const q=state.bank.find(x=>x.id===idv);if(q){const c=JSON.parse(JSON.stringify(q));c.id=id();state.questions.push(c);silent();go('builder');toast('Inserted from bank')}}
function design(m){m.innerHTML=`<section class="hero"><h1>◈ Design <span>Studio</span></h1><p>ESI blue, navy and gold at the core, with bright mode and accessibility choices for the learner.</p></section><section class="panel"><div class="cards"><button class="card" onclick="setTheme('dark')"><em>◐</em><strong>ESI Dark</strong><span>Navy canvas with blue controls and gold highlights.</span></button><button class="card" onclick="setTheme('light')"><em>☀</em><strong>ESI Bright</strong><span>Clean bright presentation with ESI blue and gold.</span></button><button class="card" onclick="toast('Advanced design controls ready for expansion')"><em>◈</em><strong>Custom system</strong><span>Spacing, radius, density and presentation tokens.</span></button></div></section><section class="panel"><div class="title"><div><h2>Accessibility</h2><p>Make the learner experience clearer and more flexible.</p></div></div>${['Large text','High contrast','Screen-reader labels','Auto alt-text','Captions','Narration','Reduced motion','Extended time','RTL layout','Color-safe status'].map(x=>`<label class="check"><input type="checkbox" onchange="toast('${x} '+(this.checked?'enabled':'disabled'))">${x}</label>`).join('')}</section><section class="panel"><div class="title"><div><h2>Starter templates</h2><p>Jump straight into a proven structure.</p></div></div><div class="registry">${['Exam / CBT','Classroom review','Trivia','Certification','Feedback','Game show','Story quiz','Case study','Adaptive practice','Personality','Icebreaker','Hiring assessment'].map(x=>`<button class="reg" onclick="applyTemplate('${x}')"><b>${x}</b><span>Apply starter structure</span></button>`).join('')}</div></section>`}
function setTheme(x){state.theme=x;applyTheme();silent();toast(x==='light'?'Bright mode enabled':'Dark mode enabled')}function media(m){m.innerHTML=`<section class="hero"><h1>▧ Media <span>Lab</span></h1><p>Stage assets and explore the complete visual-question toolkit.</p></section><section class="panel"><div class="title"><div><h2>Media intake</h2><p>Files are staged locally in this workspace.</p></div></div><input id="mediaFile" class="input" type="file" multiple accept="image/*,audio/*,video/*" onchange="stageMedia(this.files)"><div id="mediaStatus" style="margin-top:8px;color:var(--muted);font-size:8px">${state.media.length} staged asset(s)</div></section><section class="panel"><div class="title"><div><h2>45 image question patterns</h2><p>Search the full visual interaction catalog.</p></div></div><input class="input" placeholder="Search visual pattern..." oninput="filterRegistry(this.value)"><div id="imageRegistry" class="registry" style="margin-top:8px"></div></section>`;renderImageRegistry('')}function renderImageRegistry(term){const r=document.getElementById('imageRegistry');if(!r)return;term=term.toLowerCase();r.innerHTML=image45.map((k,i)=>[k,i+1]).filter(x=>(types[x[0]]||x[0]).toLowerCase().includes(term)).map(x=>`<div class="reg"><b>${x[1]}. ${esc(types[x[0]]||x[0])}</b><span>Media • interaction state • validation • accessibility • grading contract.</span></div>`).join('')}function filterRegistry(v){renderImageRegistry(v)}function stageMedia(files){if(!files?.length)return;[...files].forEach(f=>state.media.push({id:id('media'),name:f.name,type:f.type,size:f.size}));silent();document.getElementById('mediaStatus').textContent=state.media.length+' staged asset(s)';toast('Media staged')}
function live(m){m.innerHTML=`<section class="hero"><h1>● Live <span>& Async</span></h1><p>Prepare live rooms, assignments and learner distribution from one control surface.</p></section><section class="panel"><div class="title"><div><h2>Session control</h2><p>Room setup is ready for realtime connection.</p></div><button class="btn blue" onclick="createRoom()">Create room</button></div><div class="grid4"><div class="stat"><b id="roomCode">—</b><span>Room code</span></div><div class="stat"><b>0</b><span>Players</span></div><div class="stat"><b>${state.questions.length}</b><span>Questions</span></div><div class="stat"><b>${state.settings.time||0}</b><span>Minutes</span></div></div><div class="cards"><button class="card" onclick="toast('QR join prepared')"><em>▦</em><strong>QR Join</strong><span>Fast room entry payload.</span></button><button class="card" onclick="toast('Host controls ready')"><em>●</em><strong>Host controls</strong><span>Pause, skip, reveal, extend, teams and cohost.</span></button><button class="card" onclick="toast('Assignment workflow ready')"><em>↗</em><strong>Async assignment</strong><span>Schedule, attempts, resume and review.</span></button></div></section><section class="panel"><div class="registry">${['Public link','Invite-only','Password','Access code','QR code','Embed / iframe','Scheduled release','Class directory','Observer link','Spectator mode'].map(x=>`<button class="reg" onclick="toast('${x} selected')"><b>${x}</b><span>Distribution control</span></button>`).join('')}</div></section>`}function createRoom(){const c=Math.random().toString(36).slice(2,8).toUpperCase();const e=document.getElementById('roomCode');if(e)e.textContent=c;toast('Room '+c+' ready')}
function analytics(m){const n=state.questions.length,pts=state.questions.reduce((a,q)=>a+(+q.points||1),0),nx=state.nexus;m.innerHTML=`<section class="hero"><h1>⬡ Nexus <span>Analytics</span></h1><p>Five forces meet in one living model: Speed, Accuracy, Difficulty, Consistency and Mastery. Drag the points on the pentagon or use the precision sliders. The balance score changes immediately.</p></section><div class="nexus"><section class="nexus-card nexus-stage"><svg id="nexusSvg" class="nexus-svg" viewBox="0 0 560 500" role="img" aria-label="Interactive Nexus performance pentagon"></svg></section><section class="nexus-card"><div class="title"><div><h2>Balance core</h2><p>Overall performance balance</p></div><span class="pill good">LIVE</span></div><div class="score-ring" id="scoreRing" style="--score:${nexusScore(nx)}"><strong id="nexusScore">${nexusScore(nx)}</strong><small>CORE</small></div><div class="metric-grid"><div class="metric"><b>${Math.round((nx.speed+nx.accuracy)/2)}%</b><span>Speed × accuracy</span></div><div class="metric"><b>${Math.round((nx.consistency+nx.mastery)/2)}%</b><span>Consistency × mastery</span></div><div class="metric"><b>${n}%</b><span>Quiz completion base</span></div><div class="metric"><b>${pts}</b><span>Available points</span></div></div><div class="factor-list">${[['speed','Speed'],['accuracy','Accuracy'],['difficulty','Difficulty'],['consistency','Consistency'],['mastery','Mastery']].map(([k,l])=>`<div class="factor-row"><b>${l}</b><input type="range" min="0" max="100" value="${nx[k]}" oninput="setNexus('${k}',this.value)"><output id="out_${k}">${nx[k]}%</output></div>`).join('')}</div></section></div><section class="panel"><div class="title"><div><h2>What the Nexus sees</h2><p>A stronger center means the five forces are balanced rather than one force carrying the whole result.</p></div></div><div class="cards"><div class="card"><em>⚡</em><strong>Speed</strong><span>How quickly the learner or session moves through the task.</span></div><div class="card"><em>🎯</em><strong>Accuracy</strong><span>How reliably answers land on the intended target.</span></div><div class="card"><em>◈</em><strong>Difficulty</strong><span>How demanding the selected content is.</span></div><div class="card"><em>♢</em><strong>Consistency</strong><span>How stable performance remains across the run.</span></div><div class="card"><em>✦</em><strong>Mastery</strong><span>How deeply the learner demonstrates the target skill.</span></div></div></section><section class="panel"><div class="title"><div><h2>Performance signals</h2><p>Built to become response-driven when result data is connected.</p></div></div>${[['Speed',nx.speed],['Accuracy',nx.accuracy],['Difficulty',nx.difficulty],['Consistency',nx.consistency],['Mastery',nx.mastery]].map(x=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:7px;color:var(--muted)"><span>${x[0]}</span><b style="color:var(--gold)">${x[1]}%</b></div><div class="progress"><i style="width:${x[1]}%"></i></div></div>`).join('')}</section>`;drawNexus()}
function nexusScore(n){const vals=Object.values(n).map(Number);const mean=vals.reduce((a,b)=>a+b,0)/vals.length;const variance=vals.reduce((a,b)=>a+(b-mean)**2,0)/vals.length;return Math.max(0,Math.min(100,Math.round(mean-Math.sqrt(variance)*.42)))}
function setNexus(k,v){state.nexus[k]=Math.max(0,Math.min(100,+v||0));silent();document.getElementById('out_'+k).textContent=state.nexus[k]+'%';const s=nexusScore(state.nexus);document.getElementById('nexusScore').textContent=s;document.getElementById('scoreRing').style.setProperty('--score',s);drawNexus()}
function drawNexus(){const svg=document.getElementById('nexusSvg');if(!svg)return;const keys=['speed','accuracy','difficulty','consistency','mastery'],labels=['SPEED','ACCURACY','DIFFICULTY','CONSISTENCY','MASTERY'],vals=keys.map(k=>state.nexus[k]),cx=280,cy=250,R=155,outer=185,pt=(i,r)=>{const a=-Math.PI/2+i*Math.PI*2/5;return{x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r}};let out='';[.2,.4,.6,.8,1].forEach(scale=>{out+=`<polygon class="nexus-grid" points="${keys.map((_,i)=>{const p=pt(i,R*scale);return p.x+','+p.y}).join(' ')}"></polygon>`});keys.forEach((_,i)=>{const p=pt(i,R);out+=`<line class="nexus-axis" x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}"></line>`});const data=keys.map((k,i)=>{const p=pt(i,R*vals[i]/100);return p.x+','+p.y}).join(' ');out+=`<polygon class="nexus-fill" points="${data}"></polygon><circle class="nexus-center" cx="${cx}" cy="${cy}" r="25"></circle><text x="${cx}" y="${cy+4}" text-anchor="middle" class="nexus-value">${nexusScore(state.nexus)}</text>`;keys.forEach((k,i)=>{const p=pt(i,R*vals[i]/100),lp=pt(i,outer+8);out+=`<text class="nexus-label" x="${lp.x}" y="${lp.y}" text-anchor="middle">${labels[i]}</text><text class="nexus-value" x="${p.x}" y="${p.y-9}" text-anchor="middle">${vals[i]}%</text><circle class="nexus-handle" data-k="${k}" cx="${p.x}" cy="${p.y}" r="9"></circle>`});svg.innerHTML=out;svg.querySelectorAll('.nexus-handle').forEach(h=>{h.addEventListener('pointerdown',startNexusDrag)})}
function startNexusDrag(e){e.preventDefault();const k=e.currentTarget.dataset.k,svg=document.getElementById('nexusSvg');const move=ev=>{const p=ev.touches?ev.touches[0]:ev,r=svg.getBoundingClientRect(),x=(p.clientX-r.left)/r.width*560,y=(p.clientY-r.top)/r.height*500,cx=280,cy=250;let a=Math.atan2(y-cy,x-cx)+Math.PI/2;if(a<0)a+=Math.PI*2;const sector=Math.round(a/(Math.PI*2/5))%5,base=-Math.PI/2+sector*Math.PI*2/5,projection=(x-cx)*Math.cos(base)+(y-cy)*Math.sin(base),val=Math.round(Math.max(0,Math.min(100,projection/185*100)));state.nexus[k]=val;document.getElementById('out_'+k).textContent=val+'%';const s=nexusScore(state.nexus);document.getElementById('nexusScore').textContent=s;document.getElementById('scoreRing').style.setProperty('--score',s);silent();drawNexus()};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)}
function advanced(m){m.innerHTML=`<section class="hero"><h1>⚙ All <span>Features</span></h1><p>Explore the complete ESI ecosystem map. Every major family and all 140 novel concepts have a named place in the product architecture.</p><div class="actions"><button class="btn gold" onclick="openValidation()">Validate quiz</button><button class="btn" onclick="openArchitecture()">Architecture</button><button class="btn" onclick="openHistory()">Version history</button><button class="btn" onclick="openImport()">Import center</button></div></section><section class="panel"><div class="title"><div><h2>Feature families</h2><p>${featureGroups.length} major groups.</p></div></div><div class="featurelist">${featureGroups.map(x=>`<div class="reg"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div></section><section class="panel"><div class="title"><div><h2>Novel feature registry — 140</h2><p>Search every concept.</p></div></div><input class="input" placeholder="Search novel features..." oninput="filterNovel(this.value)"><div id="novelList" class="registry" style="margin-top:8px"></div></section>`;filterNovel('')}function filterNovel(v){const r=document.getElementById('novelList');if(!r)return;v=v.toLowerCase();r.innerHTML=novel.map((x,i)=>[x,i+1]).filter(x=>x[0].toLowerCase().includes(v)).map(x=>`<div class="reg"><b>${String(x[1]).padStart(3,'0')} · ${esc(x[0])}</b><span>Concept surface • interaction • state • validation • accessibility.</span></div>`).join('')}
function openModal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})
function preview(){openModal(`<div class="modalhead"><h2>Student Preview</h2><button class="close" onclick="closeModal()">×</button></div><div class="preview"><h1>${esc(state.title)}</h1><p>${esc(state.description)}</p>${state.questions.map((q,i)=>`<div class="pvq"><b>${i+1}. ${esc(q.text||'Untitled question')}</b>${(q.options||[]).map(o=>`<span class="pvopt">${esc(o.text||'Option')}</span>`).join('')}</div>`).join('')||'<p>No questions yet.</p>'}</div>`)}function openShare(){openModal(`<div class="modalhead"><h2>Share quiz</h2><button class="close" onclick="closeModal()">×</button></div><p style="color:var(--muted);font-size:9px">Choose how you want learners to receive the quiz when publishing is connected.</p><div class="registry">${['Share link','QR code','Invite code','Embed','Password','Invite-only','Schedule'].map(x=>`<button class="reg" onclick="toast('${x} selected');closeModal()"><b>${x}</b><span>Distribution option</span></button>`).join('')}</div>`)}function publish(){snapshot();silent();openModal(`<div class="modalhead"><h2>Publish check</h2><button class="close" onclick="closeModal()">×</button></div>${['Title present','Questions reviewed','Answer keys reviewed','Scoring configured','Accessibility reviewed','Distribution selected'].map(x=>`<div class="check"><input type="checkbox" checked>${x}</div>`).join('')}<button class="btn gold" onclick="toast('Quiz marked ready');closeModal()">Mark ready</button>`)}
function openTemplates(){openModal(`<div class="modalhead"><h2>Template Gallery</h2><button class="close" onclick="closeModal()">×</button></div><div class="registry">${['Exam / CBT','Classroom review','Trivia','Hiring','Icebreaker','Personality','Certification','Feedback','Game show','Story quiz','Case study','Adaptive practice'].map(x=>`<button class="reg" onclick="applyTemplate('${x}')"><b>${x}</b><span>Apply starter template</span></button>`).join('')}</div>`)}function applyTemplate(name){state.title=name+' Quiz';state.description='Created from the ESI '+name+' template.';if(!state.questions.length)state.questions=[makeQ('multiple_choice'),makeQ('true_false'),makeQ('short_text')];silent();closeModal();go('builder');toast(name+' template applied')}
function openImport(){openModal(`<div class="modalhead"><h2>Import Center</h2><button class="close" onclick="closeModal()">×</button></div><p style="color:var(--muted);font-size:9px">Select the format you are bringing into the workspace.</p><div class="registry">${['CSV / Excel','Word','PDF','PPTX','Google Forms','Kahoot XLSX','GIFT / Moodle XML','QTI','Anki','JSON'].map(x=>`<button class="reg" onclick="toast('${x} selected')"><b>${x}</b><span>Import workflow</span></button>`).join('')}</div><input class="input" style="margin-top:9px" type="file" onchange="toast('File staged')">`)}function openValidation(){const issues=[];if(!state.title.trim())issues.push('Quiz title is empty.');state.questions.forEach((q,i)=>{if(!q.text.trim())issues.push('Question '+(i+1)+' has no prompt.');if(['multiple_choice','multiple_select','true_false','yes_no'].includes(q.type)&&!(q.options||[]).some(x=>x.correct))issues.push('Question '+(i+1)+' needs an answer key.');if(q.points<0)issues.push('Question '+(i+1)+' has negative points.')});openModal(`<div class="modalhead"><h2>Validation</h2><button class="close" onclick="closeModal()">×</button></div>${issues.length?issues.map(x=>`<div class="reg" style="margin-bottom:6px"><b>Review</b><span>${esc(x)}</span></div>`).join(''):'<div class="reg"><b>✓ Ready</b><span>No blocking validation issues were found.</span></div>'}`)}function openArchitecture(){openModal(`<div class="modalhead"><h2>Architecture</h2><button class="close" onclick="closeModal()">×</button></div><div class="registry">${[['User interface','Mobile-first ESI creator workspace'],['Local state','Browser storage + recovery'],['Authentication','Firebase/Supabase adapter'],['Realtime','Firebase RTDB/Supabase Realtime adapter'],['Storage','Firebase/Supabase/R2 adapter'],['Server','Cloudflare Worker / Pages Function'],['AI','Secure server-side provider adapter'],['Analytics','Responses → scoring → Nexus'],['Security','Rules, validation, rate limits and audit']].map(x=>`<div class="reg"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>`)}function openHistory(){openModal(`<div class="modalhead"><h2>Version History</h2><button class="close" onclick="closeModal()">×</button></div>${(state.history||[]).map((x,i)=>`<div class="reg" style="margin-bottom:6px"><b>Snapshot ${i+1}</b><span>${new Date(x.at).toLocaleString()} • ${x.questions} questions • ${esc(x.title)}</span></div>`).join('')||'<div class="reg"><b>No snapshots yet</b><span>Save to create one.</span></div>'}`)}function openSettings(){openModal(`<div class="modalhead"><h2>Settings</h2><button class="close" onclick="closeModal()">×</button></div><div class="propertyrow"><label>Workspace storage</label><select class="input"><option>Local-first</option><option>Cloud when connected</option></select></div><div class="propertyrow"><label>Draft identifier</label><input class="input" value="${KEY}" readonly></div>${['Minimize response data','Allow export','Allow deletion','Validate before publish','Keep secrets off the client'].map(x=>`<label class="check"><input type="checkbox" checked disabled>${x}</label>`).join('')}<button class="btn red full" onclick="clearDraft()">Clear this device draft</button>`)}function clearDraft(){if(confirm('Clear this device draft?')){localStorage.removeItem(KEY);location.reload()}}function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(state.title||'esi-quiz').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('JSON exported')}function exportBank(){const blob=new Blob([JSON.stringify(state.bank,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='esi-question-bank.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Bank exported')}
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}if(e.key==='Escape')closeModal()});load();applyTheme();setTimeout(()=>{document.getElementById('compactToggle')?.classList.toggle('on',!!state.compact);go('home')},0);
</script>
