function toggleCompact(){state.compact=!state.compact;document.getElementById('compactToggle').classList.toggle('on',state.compact);document.body.style.fontSize=state.compact?'95%':'';silent()}
function go(p){page=p;document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',(b.getAttribute('onclick')||'').includes("'"+p+"'")));document.querySelectorAll('.bottom button').forEach((b,i)=>b.classList.toggle('active',['home','builder','ai','bank','design','advanced'][i]===p));render(p);window.scrollTo({top:0,behavior:'smooth'})}
function render(p){const m=document.getElementById('main');if(p==='home')return home(m);if(p==='builder')return builder(m);if(p==='ai')return ai(m);if(p==='bank')return bank(m);if(p==='design')return design(m);if(p==='media')return media(m);if(p==='live')return live(m);if(p==='analytics')return analytics(m);advanced(m)}
function home(m){m.innerHTML=`<section class="hero"><h1>Build your <span>perfect quiz.</span></h1><p>ESI Creator Studio is a single-file, mobile-first authoring workspace. The public UI contains no provider API-key fields. Backend credentials belong behind secure server-side adapters.</p><div class="actions"><button class="btn gold" onclick="newQuiz()">＋ New Quiz</button><button class="btn blue" onclick="go('builder')">Open Builder</button><button class="btn" onclick="go('ai')">✦ AI Studio</button><button class="btn" onclick="openTemplates()">Template Gallery</button><button class="btn" onclick="openImport()">⇩ Import</button></div></section><div class="grid4"><div class="stat"><b>${state.questions.length}</b><span>Questions</span></div><div class="stat"><b>${state.questions.reduce((a,q)=>a+(+q.points||1),0)}</b><span>Total points</span></div><div class="stat"><b>${state.bank.length}</b><span>Bank items</span></div><div class="stat"><b>${featureGroups.length+novel.length}</b><span>Blueprint features</span></div></div><section class="panel"><div class="title"><div><h2>Start creating</h2><p>Choose a complete workflow.</p></div></div><div class="cards"><button class="card" onclick="go('builder')"><em>▣</em><strong>Manual Builder</strong><span>Sections, question cards, answer keys, points, validation, preview and settings.</span></button><button class="card" onclick="go('ai')"><em>✦</em><strong>AI Quiz Studio</strong><span>Topic, text, document, webpage, OCR and voice source contracts.</span></button><button class="card" onclick="go('bank')"><em>▤</em><strong>Question Bank</strong><span>Search, folders, tags, reuse, clone, quality and marketplace-ready records.</span></button><button class="card" onclick="go('design')"><em>◈</em><strong>Design Studio</strong><span>ESI blue/gold themes, covers, accessibility and responsive presentation.</span></button><button class="card" onclick="go('media')"><em>▧</em><strong>Media Lab</strong><span>Images, audio, video, captions, alt text and 45 image interactions.</span></button><button class="card" onclick="go('live')"><em>●</em><strong>Live & Async</strong><span>Rooms, QR join, host controls, teams, assignments and adaptive modes.</span></button></div></section><section class="panel"><div class="title"><div><h2>Build status</h2><p>Feature families are represented as real creator surfaces before cloud engines are connected.</p></div><span class="chip active">Local-first</span></div><div class="featurelist">${featureGroups.slice(0,10).map(x=>`<div class="reg"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div></section>`}
function newQuiz(){if(state.questions.length&&!confirm('Start a new quiz? Export the current draft first if you need a copy.'))return;state.title='Untitled Quiz';state.description='Create an engaging quiz with ESI Creator Studio.';state.questions=[];state.sections=[];state.media=[];silent();go('builder');toast('New quiz ready')}
function makeQ(type='multiple_choice'){const fixed=type==='true_false'?['True','False']:type==='yes_no'?['Yes','No']:null;return{id:id(),type,text:'',points:1,required:false,explanation:'',hint:'',tags:[],answer:'',media:'',interaction:'',options:fixed?fixed.map((x,i)=>({text:x,correct:i===0})):['multiple_choice','multiple_select','poll','ordering'].includes(type)?[{text:'',correct:true},{text:'',correct:false},{text:'',correct:false},{text:'',correct:false}]:[],pairs:type==='matching'?[{left:'',right:''},{left:'',right:''}]:[]}}
function addQuestion(type='multiple_choice'){state.questions.push(makeQ(type));silent();builder();setTimeout(()=>document.querySelector('.question:last-of-type textarea')?.focus(),50)}
function addSection(){state.sections.push({id:id('s'),title:'New Section',description:''});silent();builder()}
function deleteQ(idv){state.questions=state.questions.filter(q=>q.id!==idv);silent();builder()}
function duplicateQ(i){const q=JSON.parse(JSON.stringify(state.questions[i]));q.id=id();state.questions.splice(i+1,0,q);silent();builder()}
function moveQ(i,d){const n=i+d;if(n<0||n>=state.questions.length)return;[state.questions[i],state.questions[n]]=[state.questions[n],state.questions[i]];silent();builder()}
function updateQ(idv,k,v){const q=state.questions.find(q=>q.id===idv);if(q){q[k]=v;silent()}}
function setOption(idv,j,v){const q=state.questions.find(q=>q.id===idv);if(q?.options[j]){q.options[j].text=v;silent()}}
function setCorrect(idv,j,m){const q=state.questions.find(q=>q.id===idv);if(!q)return;if(m)q.options[j].correct=!q.options[j].correct;else q.options.forEach((o,k)=>o.correct=k===j);silent()}
function addOption(idv){const q=state.questions.find(q=>q.id===idv);if(q){q.options.push({text:'',correct:false});silent();builder()}}
function removeOption(idv,j){const q=state.questions.find(q=>q.id===idv);if(q){q.options.splice(j,1);silent();builder()}}
function addPair(idv){const q=state.questions.find(q=>q.id===idv);if(q){q.pairs.push({left:'',right:''});silent();builder()}}
function setPair(idv,j,k,v){const q=state.questions.find(q=>q.id===idv);if(q?.pairs[j]){q.pairs[j][k]=v;silent()}}
function qRequired(idv,v){const q=state.questions.find(q=>q.id===idv);if(q)q.required=v;silent()}
function changeType(idv){const q=state.questions.find(q=>q.id===idv);if(!q)return;const ks=Object.keys(types),n=(ks.indexOf(q.type)+1)%ks.length;q.type=ks[n];q.options=[];q.pairs=[];silent();builder();toast('Type changed to '+types[q.type])}
function toggleMore(idv){document.getElementById('more_'+idv)?.classList.toggle('hidden')}
function filterTools(v){document.querySelectorAll('#tools .tool').forEach(x=>x.style.display=x.dataset.name.includes(v.toLowerCase())?'block':'none')}
function questionBody(q){if(['multiple_choice','multiple_select','true_false','yes_no','poll','ordering'].includes(q.type))return(q.options||[]).map((o,j)=>`<div class="optionrow"><input class="correct" type="${q.type==='multiple_select'?'checkbox':'radio'}" name="c_${q.id}" ${o.correct?'checked':''} onchange="setCorrect('${q.id}',${j},${q.type==='multiple_select'})"><input class="input" value="${esc(o.text)}" placeholder="Option ${j+1}" oninput="setOption('${q.id}',${j},this.value)"><button class="icon" onclick="removeOption('${q.id}',${j})">×</button></div>`).join('')+`<button class="tiny" onclick="addOption('${q.id}')">＋ Add option</button>`;if(q.type==='matching')return(q.pairs||[]).map((p,j)=>`<div class="optionrow"><input class="input" value="${esc(p.left)}" placeholder="Left" oninput="setPair('${q.id}',${j},'left',this.value)"><input class="input" value="${esc(p.right)}" placeholder="Match" oninput="setPair('${q.id}',${j},'right',this.value)"></div>`).join('')+`<button class="tiny" onclick="addPair('${q.id}')">＋ Pair</button>`;if(image45.includes(q.type)||q.type.startsWith('image'))return`<div class="propertyrow"><label>Media source</label><input class="input" value="${esc(q.media)}" placeholder="Image/media URL or storage asset ID" oninput="updateQ('${q.id}','media',this.value)"></div><div class="propertyrow"><label>Interaction data</label><input class="input" value="${esc(q.interaction)}" placeholder="Coordinates, targets, layers, sequence or grading data" oninput="updateQ('${q.id}','interaction',this.value)"></div>`;return`<div class="propertyrow"><label>Expected answer / grading rule</label><input class="input" value="${esc(q.answer)}" placeholder="Answer, rubric, formula or tolerance rule" oninput="updateQ('${q.id}','answer',this.value)"></div>`}
function questionCard(q,i){return`<article class="question"><div class="qtop"><div class="qbadge">${i+1}</div><div class="qtype">${esc(types[q.type]||q.type)}</div><button class="icon" onclick="moveQ(${i},-1)">↑</button><button class="icon" onclick="moveQ(${i},1)">↓</button><button class="icon" onclick="duplicateQ(${i})">⧉</button><button class="icon" onclick="deleteQ('${q.id}')">×</button></div><textarea class="input" placeholder="Type your question..." oninput="updateQ('${q.id}','text',this.value)">${esc(q.text)}</textarea>${questionBody(q)}<div class="qfoot"><label>Required <input type="checkbox" ${q.required?'checked':''} onchange="qRequired('${q.id}',this.checked)"></label><label>Points <input style="width:55px" class="input" type="number" value="${q.points}" onchange="updateQ('${q.id}','points',+this.value||0)"></label><button class="tiny" onclick="changeType('${q.id}')">Change type</button><button class="tiny" onclick="saveToBank('${q.id}')">Save to bank</button><button class="tiny" onclick="toggleMore('${q.id}')">More</button></div><div id="more_${q.id}" class="hidden" style="margin-top:8px"><textarea class="input" placeholder="Explanation" oninput="updateQ('${q.id}','explanation',this.value)">${esc(q.explanation)}</textarea><input class="input" style="margin-top:5px" value="${esc(q.hint)}" placeholder="Hint" oninput="updateQ('${q.id}','hint',this.value)"><input class="input" style="margin-top:5px" value="${esc((q.tags||[]).join(', '))}" placeholder="Tags" oninput="updateQ('${q.id}','tags',this.value.split(',').map(x=>x.trim()).filter(Boolean))"></div></article>`}
function builder(m){m.innerHTML=`<div class="panel"><div class="title"><div><h2>Quiz Builder</h2><p>Author → validate → preview → distribute.</p></div><div class="actions"><button class="btn" onclick="addSection()">＋ Section</button><button class="btn blue" onclick="addQuestion()">＋ Question</button><button class="btn gold" onclick="save()">Save</button></div></div></div><div class="workspace"><aside class="toolbox"><h3>Question types</h3><div class="toolsearch"><input class="input" placeholder="Find a type..." oninput="filterTools(this.value)"></div><div id="tools">${Object.entries(types).map(([k,v])=>`<button class="tool" data-name="${esc(v.toLowerCase())}" onclick="addQuestion('${k}')"><b>＋</b>${esc(v)}</button>`).join('')}</div></aside><section class="canvas"><div class="canvasbar"><button class="chip active">Questions</button><button class="chip" onclick="go('design')">Design</button><button class="chip" onclick="go('media')">Media</button><button class="chip" onclick="go('bank')">Bank</button><button class="chip" onclick="openValidation()">Validate</button><button class="chip" onclick="go('advanced')">All features</button></div><div class="quizcover"><input class="input" value="${esc(state.title)}" oninput="state.title=this.value;silent()"><textarea class="input" placeholder="Quiz description..." oninput="state.description=this.value;silent()">${esc(state.description)}</textarea></div>${state.sections.map((s,i)=>`<div class="section"><b>SECTION ${i+1}</b><input class="input" value="${esc(s.title)}" oninput="state.sections[${i}].title=this.value;silent()"><input class="input" value="${esc(s.description||'')}" placeholder="Section instructions" oninput="state.sections[${i}].description=this.value;silent()"></div>`).join('')}${state.questions.length?state.questions.map(questionCard).join(''):`<div class="panel" style="text-align:center;padding:42px"><h2 style="margin:0 0 5px">Your canvas is ready</h2><p style="color:var(--muted);font-size:9px">Add a question from the toolbox.</p><button class="btn blue" onclick="addQuestion()">＋ Add first question</button></div>`}</section><aside class="properties"><h3>Quiz settings</h3><div class="propertyrow"><label>Mode</label><select class="input" onchange="state.mode=this.value;silent()">${['classic','async','live','adaptive','practice','poll','exam'].map(x=>`<option ${state.mode===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="propertyrow"><label>Time limit (minutes)</label><input class="input" type="number" value="${state.settings.time}" oninput="state.settings.time=+this.value||0;silent()"></div><div class="propertyrow"><label>Passing score %</label><input class="input" type="number" value="${state.settings.pass}" oninput="state.settings.pass=+this.value||0;silent()"></div>${['showScore','showAnswers','showExplain','randomQ','randomA','back','anonymous','leaderboard'].map(k=>`<label class="check"><input type="checkbox" ${state.settings[k]?'checked':''} onchange="state.settings.${k}=this.checked;silent()">${labelSetting(k)}</label>`).join('')}<button class="btn green" style="width:100%;margin-top:8px" onclick="preview()">▶ Student Preview</button><button class="btn" style="width:100%;margin-top:5px" onclick="exportJSON()">⇩ Export JSON</button></aside></div>`}
function labelSetting(k){return({showScore:'Show score',showAnswers:'Show correct answers',showExplain:'Show explanations',randomQ:'Randomize questions',randomA:'Randomize answers',back:'Allow back navigation',anonymous:'Allow anonymous responses',leaderboard:'Live leaderboard hook'})[k]}
function ai(m){m.innerHTML=`<section class="hero"><h1>✦ AI <span>Studio</span></h1><p>Safe public workflow: source inputs are collected here, while provider credentials stay server-side in a Worker/Function.</p></section><section class="panel"><div class="title"><div><h2>Generation workflows</h2><p>Prepare structured jobs for the future AI adapter.</p></div></div><div class="cards"><button class="card" onclick="aiDemo('topic')"><em>✦</em><strong>Topic → Quiz</strong><span>Topic, subject, question count, difficulty, Bloom level and language.</span></button><button class="card" onclick="aiDemo('text')"><em>▤</em><strong>Text → Quiz</strong><span>Paste lesson notes and generate a review-ready draft.</span></button><button class="card" onclick="aiDemo('document')"><em>PDF</em><strong>Document → Quiz</strong><span>PDF/DOCX/PPTX source adapter with OCR and extraction stages.</span></button><button class="card" onclick="aiDemo('web')"><em>◎</em><strong>Web / video</strong><span>URL source, transcript extraction and fact-aware question generation.</span></button><button class="card" onclick="aiDemo('photo')"><em>▧</em><strong>Textbook photo</strong><span>OCR → cleanup → question generation → review.</span></button><button class="card" onclick="aiDemo('voice')"><em>◉</em><strong>Voice → Quiz</strong><span>Speech transcription → structured quiz draft.</span></button></div></section><section class="panel"><div class="title"><div><h2>AI controls</h2><p>These are safe job parameters, not API credentials.</p></div></div><div class="propertyrow"><label>Topic / source instruction</label><textarea id="aiPrompt" class="input" style="min-height:110px" placeholder="e.g. Create a Biology revision quiz about cell division..."></textarea></div><div class="grid4"><div><label class="propertyrow"><label>Questions</label><input id="aiCount" class="input" type="number" value="10"></label></div><div><label class="propertyrow"><label>Difficulty</label><select id="aiDiff" class="input"><option>mixed</option><option>easy</option><option>medium</option><option>hard</option></select></label></div><div><label class="propertyrow"><label>Bloom</label><select id="aiBloom" class="input"><option>mixed</option><option>remember</option><option>understand</option><option>apply</option><option>analyze</option><option>evaluate</option><option>create</option></select></label></div><div><label class="propertyrow"><label>Language</label><input id="aiLang" class="input" value="English"></label></div></div><button class="btn gold" onclick="generateDraft()">✦ Prepare generation job</button><div id="aiStatus" style="margin-top:8px;color:var(--muted);font-size:8px"></div></section><section class="panel"><div class="title"><div><h2>Secure engine architecture</h2><p>No public API key field is included.</p></div></div><div class="featurelist"><div class="reg"><b>Client</b><span>Collects safe prompt/source metadata only.</span></div><div class="reg"><b>Cloudflare Worker</b><span>Receives authenticated generation jobs and holds provider secrets.</span></div><div class="reg"><b>Providers</b><span>Workers AI / Gemini / Groq adapters can be selected server-side.</span></div><div class="reg"><b>Output</b><span>Validated quiz JSON returns to this editor for human review.</span></div></div></section>`}
function aiDemo(kind){const s=document.getElementById('aiPrompt');if(s)s.value={topic:'Create a balanced revision quiz from this topic: ',text:'Turn the following lesson text into a quiz: ',document:'Generate questions from the uploaded document.',web:'Generate questions from this webpage/video source.',photo:'Read the textbook image and create questions.',voice:'Turn this spoken lesson into quiz questions.'}[kind];toast('AI '+kind+' workflow selected')}
function generateDraft(){const p=document.getElementById('aiPrompt')?.value.trim();if(!p){toast('Enter a topic or source instruction first');return}document.getElementById('aiStatus').textContent='Generation job prepared locally. Secure Worker adapter is the next engine layer; no credential is requested here.';toast('AI job prepared')}
function bank(m){m.innerHTML=`<section class="hero"><h1>Question <span>Bank</span></h1><p>Reusable questions with local-first search, tags and cloning. Cloud library/marketplace adapters remain backend-ready.</p></section><section class="panel"><div class="title"><div><h2>Library</h2><p>${state.bank.length} saved item(s)</p></div><div class="actions"><button class="btn blue" onclick="saveAllBank()">Save current quiz</button><button class="btn" onclick="exportBank()">Export bank</button></div></div><input id="bankSearch" class="input" placeholder="Search question, type or tag..." oninput="renderBankList(this.value)"><div id="bankList" style="margin-top:9px"></div></section><section class="panel"><div class="title"><div><h2>Bank architecture</h2><p>Prepared for folders, packs, sharing, quality and marketplace workflows.</p></div></div><div class="featurelist">${['Folders & collections','Tags & taxonomy','Favorites','Difficulty labels','Quality score','Duplicate detector','Fork / remix','Public packs','Creator attribution','Marketplace metadata'].map(x=>`<div class="reg"><b>${x}</b><span>Data contract ready for local or cloud storage.</span></div>`).join('')}</div></section>`;renderBankList('')}
function renderBankList(term){const r=document.getElementById('bankList');if(!r)return;term=term.toLowerCase();const a=state.bank.filter(q=>JSON.stringify(q).toLowerCase().includes(term));r.innerHTML=a.length?a.map(q=>`<div class="tile" style="padding:10px;margin-bottom:6px;border-radius:10px"><b style="font-size:9px">${esc(q.text||'Untitled')}</b><div style="color:var(--muted);font-size:7px">${esc(types[q.type]||q.type)} • ${q.points||1} point(s)</div><button class="tiny" style="margin-top:5px" onclick="insertBank('${q.id}')">＋ Insert</button></div>`).join(''):'<div class="tile" style="padding:12px;border-radius:10px"><b style="font-size:9px">No matching bank items</b><div style="color:var(--muted);font-size:7px">Save a question or the current quiz.</div></div>'}
function saveToBank(idv){const q=state.questions.find(q=>q.id===idv);if(q){const c=JSON.parse(JSON.stringify(q));c.id=id('bank');state.bank.unshift(c);silent();toast('Saved to question bank')}}
function saveAllBank(){state.questions.forEach(q=>{const c=JSON.parse(JSON.stringify(q));c.id=id('bank');state.bank.unshift(c)});silent();go('bank');toast('Quiz questions saved to bank')}
function insertBank(idv){const q=state.bank.find(x=>x.id===idv);if(q){const c=JSON.parse(JSON.stringify(q));c.id=id();state.questions.push(c);silent();go('builder');toast('Inserted from bank')}}
function design(m){m.innerHTML=`<section class="hero"><h1>◈ Design <span>Studio</span></h1><p>ESI blue/gold identity with bright and dark presentation, covers, layout density and accessibility controls.</p></section><section class="panel"><div class="title"><div><h2>Theme</h2><p>Keep the ESI visual identity while allowing creator-level customization.</p></div></div><div class="cards"><button class="card" onclick="setTheme('dark')"><em>◐</em><strong>ESI Dark</strong><span>Navy workspace, blue controls and gold accents.</span></button><button class="card" onclick="setTheme('light')"><em>☀</em><strong>ESI Bright</strong><span>Clean white surface with blue and gold accents.</span></button><button class="card" onclick="toast('Theme tokens are ready for advanced customization')"><em>◈</em><strong>Custom tokens</strong><span>Accent, radius, spacing and typography contracts.</span></button></div></section><section class="panel"><div class="title"><div><h2>Presentation settings</h2><p>Accessible, responsive quiz presentation.</p></div></div>${['Large text mode','High contrast mode','Screen-reader labels','Auto alt-text hook','Captions required','Narration hook','Reduced motion','Extended-time support','RTL layout','Color-safe status labels'].map((x,i)=>`<label class="check"><input type="checkbox" onchange="toast('${x} '+(this.checked?'enabled':'disabled'))">${x}</label>`).join('')}</section><section class="panel"><div class="title"><div><h2>Templates</h2><p>Start quickly from common creator patterns.</p></div></div><div class="registry">${['Exam / CBT','Classroom review','Trivia','Hiring assessment','Icebreaker','Personality','Certification','Feedback','Seasonal','Game show','Story quiz','Case study'].map(x=>`<button class="reg" onclick="applyTemplate('${x}')"><b>${x}</b><span>Apply starter structure</span></button>`).join('')}</div></section>`}
function setTheme(x){state.theme=x;document.documentElement.classList.toggle('light',x==='light');document.getElementById('themeToggle').classList.toggle('on',x==='light');silent();toast(x==='light'?'Bright mode enabled':'Dark mode enabled')}
function media(m){m.innerHTML=`<section class="hero"><h1>▧ Media <span>Lab</span></h1><p>Media inventory and interaction definitions for the full image-question ecosystem.</p></section><section class="panel"><div class="title"><div><h2>Media intake</h2><p>Local browser staging now; R2/Firebase/Supabase storage can be connected later.</p></div></div><input id="mediaFile" class="input" type="file" accept="image/*,audio/*,video/*" onchange="stageMedia(this.files)"><div id="mediaStatus" style="margin-top:8px;color:var(--muted);font-size:8px"></div></section><section class="panel"><div class="title"><div><h2>45 image question patterns</h2><p>Search the registry and inspect the intended interaction.</p></div></div><input class="input" placeholder="Search image pattern..." oninput="filterRegistry(this.value)"><div id="imageRegistry" class="registry" style="margin-top:8px"></div></section>`;renderImageRegistry('')}
function renderImageRegistry(term){const r=document.getElementById('imageRegistry');if(!r)return;term=term.toLowerCase();r.innerHTML=image45.map((k,i)=>[k,types[k]]).filter(x=>x[1].toLowerCase().includes(term)).map((x,i)=>`<div class="reg"><b>${i+1}. ${esc(x[1])}</b><span>Media asset • interaction state • validation • accessibility description • grading contract.</span></div>`).join('')}
function filterRegistry(v){renderImageRegistry(v)}
function stageMedia(files){if(!files?.length)return;[...files].forEach(f=>state.media.push({id:id('media'),name:f.name,type:f.type,size:f.size}));silent();document.getElementById('mediaStatus').textContent=state.media.length+' staged media asset(s). Binary upload is intentionally deferred to the storage adapter.';toast('Media staged')}
function live(m){m.innerHTML=`<section class="hero"><h1>● Live <span>& Async</span></h1><p>Host controls and distribution architecture prepared for realtime backend wiring.</p></section><section class="panel"><div class="title"><div><h2>Host a session</h2><p>Create a local session contract now; realtime synchronization requires the secure cloud adapter.</p></div><button class="btn blue" onclick="createRoom()">Create room</button></div><div class="grid4"><div class="stat"><b id="roomCode">—</b><span>Room code</span></div><div class="stat"><b>0</b><span>Players</span></div><div class="stat"><b>${state.questions.length}</b><span>Questions</span></div><div class="stat"><b>${state.settings.time||0}</b><span>Minutes</span></div></div><div class="cards"><button class="card" onclick="toast('QR join payload prepared')"><em>▦</em><strong>QR Join</strong><span>Generate a QR payload when a public session URL exists.</span></button><button class="card" onclick="toast('Host controls staged')"><em>●</em><strong>Host controls</strong><span>Pause, skip, reveal, extend, kick, teams and cohost contracts.</span></button><button class="card" onclick="toast('Async assignment staged')"><em>↗</em><strong>Async assignment</strong><span>Schedule, attempts, resume, review and release controls.</span></button></div></section><section class="panel"><div class="title"><div><h2>Distribution</h2><p>Choose how learners will reach the quiz.</p></div></div><div class="registry">${['Public link','Invite-only','Password','Access code','QR code','Embed / iframe','Scheduled release','Class directory','WhatsApp share','Email share','Observer link','Spectator mode'].map(x=>`<button class="reg" onclick="toast('${x} selected')"><b>${x}</b><span>Distribution contract</span></button>`).join('')}</div></section>`}
function createRoom(){const c=Math.random().toString(36).slice(2,8).toUpperCase();const e=document.getElementById('roomCode');if(e)e.textContent=c;toast('Room '+c+' prepared locally')}
function analytics(m){const n=state.questions.length,pts=state.questions.reduce((a,q)=>a+(+q.points||1),0);m.innerHTML=`<section class="hero"><h1>◒ <span>Analytics</span></h1><p>Creator-side analytics model prepared for real response data once a backend response stream is connected.</p></section><div class="grid4"><div class="stat"><b>${n}</b><span>Items</span></div><div class="stat"><b>${pts}</b><span>Points</span></div><div class="stat"><b>${n?Math.round(pts/n*100)/100:0}</b><span>Avg points</span></div><div class="stat"><b>${state.history?.length||0}</b><span>Snapshots</span></div></div><section class="panel"><div class="title"><div><h2>Item diagnostics</h2><p>Prepared fields: difficulty, discrimination, timing, responses and mastery.</p></div></div><table class="table"><thead><tr><th>#</th><th>Type</th><th>Points</th><th>Answer key</th><th>Media</th></tr></thead><tbody>${state.questions.map((q,i)=>`<tr><td>${i+1}</td><td>${esc(types[q.type]||q.type)}</td><td>${q.points||0}</td><td>${q.options?.filter(x=>x.correct).length||q.answer?'Ready':'Needs review'}</td><td>${q.media?'Attached':'—'}</td></tr>`).join('')||'<tr><td colspan="5">No questions yet.</td></tr>'}</tbody></table></section><section class="panel"><div class="title"><div><h2>Analytics pipeline</h2><p>Response → scoring → item stats → cohort → mastery → reports.</p></div></div>${['Response collection','Auto grading','Item difficulty','Discrimination','Time/question','Cohort heatmap','Benchmark','Mastery progression','AI summary','Exportable report'].map((x,i)=>`<div style="margin:7px 0"><div style="display:flex;justify-content:space-between;font-size:7px;color:var(--muted)"><span>${x}</span><span>${i<3?'Ready':'Adapter'}</span></div><div class="progress"><i style="width:${i<3?100:35}%"></i></div></div>`).join('')}</section>`}
function advanced(m){m.innerHTML=`<section class="hero"><h1>⚙ Blueprint <span>Coverage</span></h1><p>Full ecosystem registry: major feature families plus all 140 novel concepts. This screen is the product map used to drive the remaining engine work.</p><div class="actions"><button class="btn gold" onclick="openValidation()">Validate quiz</button><button class="btn" onclick="openArchitecture()">Architecture</button><button class="btn" onclick="openHistory()">Version history</button><button class="btn" onclick="openImport()">Import center</button></div></section><section class="panel"><div class="title"><div><h2>Feature families</h2><p>${featureGroups.length} major blueprint groups.</p></div></div><div class="featurelist">${featureGroups.map(x=>`<div class="reg"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div></section><section class="panel"><div class="title"><div><h2>Novel feature registry — 140</h2><p>Every named concept remains individually searchable.</p></div></div><input class="input" placeholder="Search novel features..." oninput="filterNovel(this.value)"><div id="novelList" class="registry" style="margin-top:8px"></div></section>`;filterNovel('')}
function filterNovel(v){const r=document.getElementById('novelList');if(!r)return;v=v.toLowerCase();r.innerHTML=novel.map((x,i)=>[x,i+1]).filter(x=>x[0].toLowerCase().includes(v)).map(x=>`<div class="reg"><b>${String(x[1]).padStart(3,'0')} · ${esc(x[0])}</b><span>Feature contract • UI surface • local state • backend adapter point • accessibility consideration.</span></div>`).join('')}
function openModal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function preview(){openModal(`<div class="modalhead"><h2>Student Preview</h2><button class="close" onclick="closeModal()">×</button></div><div class="preview"><h1>${esc(state.title)}</h1><p>${esc(state.description)}</p>${state.questions.map((q,i)=>`<div class="pvq"><b>${i+1}. ${esc(q.text||'Untitled question')}</b>${(q.options||[]).map(o=>`<span class="pvopt">${esc(o.text||'Option')}</span>`).join('')}</div>`).join('')||'<p>No questions yet.</p>'}</div>`) }
function openShare(){openModal(`<div class="modalhead"><h2>Share quiz</h2><button class="close" onclick="closeModal()">×</button></div><p style="color:var(--muted);font-size:9px">Publishing has not been connected to a public backend in this page. These are the distribution contracts.</p><div class="registry">${['Share link','QR code','Invite code','Embed','Password','Invite-only','Schedule'].map(x=>`<button class="reg" onclick="toast('${x} staged');closeModal()"><b>${x}</b><span>Ready for publishing adapter</span></button>`).join('')}</div>`) }
function publish(){snapshot();silent();openModal(`<div class="modalhead"><h2>Publish checklist</h2><button class="close" onclick="closeModal()">×</button></div><p style="color:var(--muted);font-size:9px">The local draft is prepared. Actual public publishing requires the server-side distribution adapter.</p>${['Title present','Questions validated','Answer keys reviewed','Scoring configured','Accessibility reviewed','Share policy selected','Backend publish adapter'].map((x,i)=>`<div class="check"><input type="checkbox" ${i<6?'checked':''} disabled>${x}</div>`).join('')}<button class="btn gold" onclick="toast('Draft marked ready for backend publishing');closeModal()">Mark ready</button>`) }
function openTemplates(){openModal(`<div class="modalhead"><h2>Template Gallery</h2><button class="close" onclick="closeModal()">×</button></div><div class="registry">${['Exam / CBT','Classroom review','Trivia','Hiring','Icebreaker','Personality','Certification','Feedback','Game show','Story quiz','Case study','Adaptive practice'].map(x=>`<button class="reg" onclick="applyTemplate('${x}')"><b>${x}</b><span>Apply starter template</span></button>`).join('')}</div>`) }
function applyTemplate(name){state.title=name+' Quiz';state.description='Created from the ESI '+name+' template.';if(!state.questions.length){state.questions=[makeQ('multiple_choice'),makeQ('true_false'),makeQ('short_text')]}silent();closeModal();go('builder');toast(name+' template applied')}
function openImport(){openModal(`<div class="modalhead"><h2>Import Center</h2><button class="close" onclick="closeModal()">×</button></div><p style="color:var(--muted);font-size:9px">Select a source contract. Binary parsing engines can be connected behind the secure adapter.</p><div class="registry">${['CSV / Excel','Word','PDF','PPTX','Google Forms','Kahoot XLSX','GIFT / Moodle XML','QTI','Anki','JSON'].map(x=>`<button class="reg" onclick="toast('${x} importer selected')"><b>${x}</b><span>Parser adapter</span></button>`).join('')}</div><input class="input" style="margin-top:9px" type="file" onchange="toast('File staged for import validation')">`) }
function openValidation(){const issues=[];if(!state.title.trim())issues.push('Quiz title is empty.');state.questions.forEach((q,i)=>{if(!q.text.trim())issues.push('Question '+(i+1)+' has no prompt.');if(['multiple_choice','multiple_select','true_false','yes_no'].includes(q.type)&&!(q.options||[]).some(x=>x.correct))issues.push('Question '+(i+1)+' needs an answer key.')});openModal(`<div class="modalhead"><h2>Validation</h2><button class="close" onclick="closeModal()">×</button></div>${issues.length?issues.map(x=>`<div class="reg" style="margin-bottom:6px"><b>Review</b><span>${esc(x)}</span></div>`).join(''):'<div class="reg"><b>✓ Ready</b><span>No blocking validation issues were found in the current local draft.</span></div>'}`)}
function openArchitecture(){openModal(`<div class="modalhead"><h2>Secure Architecture</h2><button class="close" onclick="closeModal()">×</button></div><div class="featurelist">${[['Frontend','Single HTML creator shell, local state, IndexedDB-ready'],['Auth','Firebase Auth / Supabase Auth adapter'],['Realtime','Firebase Realtime Database / Supabase Realtime'],['Storage','Firebase Storage / Supabase Storage / Cloudflare R2'],['Server','Cloudflare Worker / Pages Function'],['AI','Workers AI / Gemini / Groq behind server secrets'],['Analytics','Response stream → scoring → reports'],['Security','Rules, claims, rate limits, validation, audit logs']].map(x=>`<div class="reg"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>`) }
function openHistory(){openModal(`<div class="modalhead"><h2>Version History</h2><button class="close" onclick="closeModal()">×</button></div>${(state.history||[]).map((x,i)=>`<div class="reg" style="margin-bottom:6px"><b>Snapshot ${i+1}</b><span>${new Date(x.at).toLocaleString()} • ${x.questions} questions • ${esc(x.title)}</span></div>`).join('')||'<div class="reg"><b>No snapshots</b><span>Save the draft to create one.</span></div>'}`)}
function openSettings(){openModal(`<div class="modalhead"><h2>Settings & Security</h2><button class="close" onclick="closeModal()">×</button></div><div class="propertyrow"><label>Draft key</label><input class="input" value="${KEY}" readonly></div><div class="propertyrow"><label>Data policy</label><select class="input"><option>Local-first</option><option>Cloud when connected</option></select></div>${['Consent before collection','Minimize response data','Allow export','Allow deletion','Audit log hook','Server-side secrets only','Rate-limit hook','Content validation hook'].map(x=>`<label class="check"><input type="checkbox" checked disabled>${x}</label>`).join('')}<button class="btn red" onclick="clearDraft()">Clear local draft</button>`) }
function clearDraft(){if(confirm('Clear this device draft?')){localStorage.removeItem(KEY);location.reload()}}
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(state.title||'esi-quiz').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.json';a.click();URL.revokeObjectURL(a.href);toast('JSON exported')}
function exportBank(){const blob=new Blob([JSON.stringify(state.bank,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='esi-question-bank.json';a.click();URL.revokeObjectURL(a.href);toast('Bank exported')}
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}if(e.key==='Escape')closeModal()});
load();document.documentElement.classList.toggle('light',state.theme==='light');setTimeout(()=>{document.getElementById('themeToggle').classList.toggle('on',state.theme==='light');document.getElementById('compactToggle').classList.toggle('on',!!state.compact);go('home')},0);
</script>
</body>
</html>
